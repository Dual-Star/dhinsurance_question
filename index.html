", "D. 续保及全生命周期经营"], "answer": ["A", "B", "C", "D"], "explanation": "均为八步法的组成部分。"}]}, {"id": "M08-KP03", "title": "产品方案四步法与六句话、一次业务五问", "summary": "四步法：客户是谁→风险是什么→损失有多大→产品是否匹配。方案必须讲清六句话：为什么保、保什么、不保什么、怎么赔、赔多少、需要什么资料。一次业务五问：风险是什么？损失是什么？条款怎么定？流程怎么走？红线在哪里？", "questions": [{"id": "M08-Q07", "type": "multiple", "stem": "产品方案四步法包括（　）。", "options": ["A. 客户是谁", "B. 风险是什么", "C. 损失有多大", "D. 产品是否匹配"], "answer": ["A", "B", "C", "D"], "explanation": "四步法：客户是谁→风险是什么→损失有多大→产品是否匹配。"}, {"id": "M08-Q08", "type": "multiple", "stem": "向客户讲方案必须讲清的“六句话”包括（　）。", "options": ["A. 为什么保、保什么、不保什么", "B. 怎么赔、赔多少", "C. 需要什么资料", "D. 公司利润有多少"], "answer": ["A", "B", "C"], "explanation": "六句话：为什么保、保什么、不保什么、怎么赔、赔多少、需要什么资料。"}, {"id": "M08-Q09", "type": "single", "stem": "“一次业务五问”不包括（　）。", "options": ["A. 风险是什么", "B. 条款怎么定", "C. 红线在哪里", "D. 佣金有多高"], "answer": "D", "explanation": "五问为：风险是什么、损失是什么、条款怎么定、流程怎么走、红线在哪里。"}, {"id": "M08-Q10", "type": "judge", "stem": "方案讲解中必须明确告知客户“不保什么”。", "options": ["对", "错"], "answer": "对", "explanation": "“六句话”明确包含“不保什么”，是免责提示义务的体现。"}]}, {"id": "M08-KP04", "title": "非车险承保五步与三大前提", "summary": "五步：业务申报（收集需求、风险资料和方案并按流程申报）、核保审核（按制度、政策和授权评估风险、合规性及承保条件）、出单（审核投保资料、录入系统、提交核保并出具保单）、批改（投保人提出书面申请，涉及保额、保费等变化时按权限审批）、档案管理（完成单证回销和承保资料归档，保证完整、可追溯）。承保三大前提：资料完整、风险清晰、权限合规。", "questions": [{"id": "M08-Q11", "type": "single", "stem": "非车险承保的第一步是（　）。", "options": ["A. 业务申报", "B. 核保审核", "C. 出单", "D. 批改"], "answer": "A", "explanation": "非车险承保五步：业务申报→核保审核→出单→批改→档案管理。"}, {"id": "M08-Q12", "type": "multiple", "stem": "非车险承保的三大前提是（　）。", "options": ["A. 资料完整", "B. 风险清晰", "C. 权限合规", "D. 保费最低"], "answer": ["A", "B", "C"], "explanation": "承保三大前提：资料完整、风险清晰、权限合规。"}, {"id": "M08-Q13", "type": "single", "stem": "投保人申请变更保额、保费等内容时，应履行的环节是（　）。", "options": ["A. 业务申报", "B. 核保审核", "C. 批改", "D. 档案管理"], "answer": "C", "explanation": "批改需投保人提出书面申请，涉及保额、保费等变化时按权限审批。", "pitfall": "批改必须是“书面申请”，口头申请不合规。"}, {"id": "M08-Q14", "type": "single", "stem": "非车险承保流程中，最后一步是（　）。", "options": ["A. 批改", "B. 出单", "C. 档案管理", "D. 核保审核"], "answer": "C", "explanation": "最后一步是档案管理，完成单证回销和承保资料归档。"}]}, {"id": "M08-KP05", "title": "非车险理赔八步与车险理赔流程", "summary": "非车险理赔八步：报案受理→查勘→立案估损→定责→定损→理算→核赔支付→追偿归档。理赔核心：责任清楚、损失核准、资料可追溯。车险客户流程：电话报案（95393）→现场查勘和损失确认→提交资料→赔款计算审核→银行转账领取赔款。公司内部流程：报案→调度→查勘→定损→核价→核损→资料收集→理算→核赔→结案→赔款支付。", "questions": [{"id": "M08-Q15", "type": "single", "stem": "非车险理赔八步中，紧接“定责”之后的环节是（　）。", "options": ["A. 查勘", "B. 定损", "C. 理算", "D. 核赔支付"], "answer": "B", "explanation": "八步顺序：报案受理→查勘→立案估损→定责→定损→理算→核赔支付→追偿归档。"}, {"id": "M08-Q16", "type": "multiple", "stem": "非车险理赔的核心要求是（　）。", "options": ["A. 责任清楚", "B. 损失核准", "C. 资料可追溯", "D. 赔付越快越好、不必核损"], "answer": ["A", "B", "C"], "explanation": "理赔核心：责任清楚、损失核准、资料可追溯。"}, {"id": "M08-Q17", "type": "single", "stem": "车险理赔的报案电话是（　）。", "options": ["A. 95500", "B. 95393", "C. 95533", "D. 95511"], "answer": "B", "explanation": "车险电话报案号码为95393。"}, {"id": "M08-Q18", "type": "single", "stem": "车险理赔流程中，位于“核价”与“资料收集”之间的环节是（　）。", "options": ["A. 定损", "B. 核损", "C. 理算", "D. 结案"], "answer": "B", "explanation": "内部流程：报案→调度→查勘→定损→核价→核损→资料收集→理算→核赔→结案→赔款支付。"}, {"id": "M08-Q19", "type": "multiple", "stem": "车险客户侧的理赔流程包括（　）。", "options": ["A. 电话报案", "B. 现场查勘和损失确认", "C. 提交资料、赔款计算审核", "D. 银行转账领取赔款"], "answer": ["A", "B", "C", "D"], "explanation": "以上为客户流程的完整环节。"}]}, {"id": "M08-KP06", "title": "一线工作“六查”", "summary": "查业务是否真实、查资料是否齐全、查条款费率是否经过批准或备案、查授权是否足够、查告知是否清楚、查全过程是否留痕。", "questions": [{"id": "M08-Q20", "type": "multiple", "stem": "一线工作“六查”包括（　）。", "options": ["A. 查业务是否真实、查资料是否齐全", "B. 查条款费率是否经过批准或备案", "C. 查授权是否足够", "D. 查告知是否清楚、查全过程是否留痕"], "answer": ["A", "B", "C", "D"], "explanation": "六查：真实性、资料、条款费率、授权、告知、留痕。"}, {"id": "M08-Q21", "type": "judge", "stem": "“六查”要求核查所用条款费率是否经过批准或备案。", "options": ["对", "错"], "answer": "对", "explanation": "未经批准或备案的条款费率不得使用，这是合规红线。"}, {"id": "M08-Q22", "type": "single", "stem": "“六查”中，与销售可回溯要求直接对应的一项是（　）。", "options": ["A. 查业务是否真实", "B. 查全过程是否留痕", "C. 查授权是否足够", "D. 查资料是否齐全"], "answer": "B", "explanation": "全过程留痕直接对应销售可回溯要求。"}]}]}, {"id": "M09", "name": "互联网保险与销售合规", "source": "鼎和保险培训知识点汇总.pdf（第六~七部分）", "knowledgePoints": [{"id": "M09-KP01", "title": "互联网保险的认定", "summary": "同时满足以下条件才属于互联网保险：①保险机构通过互联网或自助终端销售产品或提供经纪服务；②消费者可在机构自营平台销售页面独立了解产品信息；③消费者能够自主完成投保。消费者通过从业人员提供的链接自行完成投保，纳入互联网保险；从业人员面对面销售后代客户线上录入，通常不属于互联网保险。", "questions": [{"id": "M09-Q01", "type": "multiple", "stem": "认定互联网保险需要同时满足的条件包括（　）。", "options": ["A. 保险机构通过互联网或自助终端销售产品或提供经纪服务", "B. 消费者可在机构自营平台销售页面独立了解产品信息", "C. 消费者能够自主完成投保", "D. 销售人员代客户完成投保操作"], "answer": ["A", "B", "C"], "explanation": "三项条件须同时满足；由销售人员代客户操作通常不属于互联网保险。"}, {"id": "M09-Q02", "type": "single", "stem": "消费者通过从业人员提供的链接自行完成投保，该业务（　）。", "options": ["A. 不属于互联网保险", "B. 纳入互联网保险", "C. 属于线下业务", "D. 属于兼业代理业务"], "answer": "B", "explanation": "由消费者自行完成投保，纳入互联网保险。"}, {"id": "M09-Q03", "type": "judge", "stem": "从业人员面对面销售后，代客户在线上录入投保信息，通常属于互联网保险。", "options": ["对", "错"], "answer": "错", "explanation": "面对面销售后代客户线上录入，通常不属于互联网保险。", "pitfall": "易错点第16条：判断关键在于消费者能否在自营平台独立了解并自主完成投保。"}, {"id": "M09-Q04", "type": "single", "stem": "判断一笔业务是否属于互联网保险，核心在于（　）。", "options": ["A. 是否使用了互联网技术", "B. 消费者能否在自营平台独立了解产品信息并自主完成投保", "C. 保费金额大小", "D. 是否有中介参与"], "answer": "B", "explanation": "核心是消费者能否独立了解并自主完成投保。"}]}, {"id": "M09-KP02", "title": "谁可以开展互联网保险", "summary": "可以经营：保险公司、全国性专业保险中介机构、符合规定的银行类兼业代理机构、符合规定的代理保险业务互联网企业。从业人员不得以个人名义开展互联网保险业务。第三方平台原则上只能提供技术辅助，不得自行开展销售、承保、理赔、退保、投诉处理和客户服务。投保申请、保费收取、保单确认等核心行为应在保险机构或保险中介机构的自营平台完成。互联网保险由总公司或法人机构统一集中运营、统一管理。", "questions": [{"id": "M09-Q05", "type": "multiple", "stem": "可以开展互联网保险业务的主体包括（　）。", "options": ["A. 保险公司", "B. 全国性专业保险中介机构", "C. 符合规定的银行类兼业代理机构", "D. 符合规定的代理保险业务互联网企业"], "answer": ["A", "B", "C", "D"], "explanation": "以上四类主体均可依规开展互联网保险业务。"}, {"id": "M09-Q06", "type": "judge", "stem": "从业人员可以以个人名义开展互联网保险业务。", "options": ["对", "错"], "answer": "错", "explanation": "从业人员不得以个人名义开展互联网保险业务。"}, {"id": "M09-Q07", "type": "multiple", "stem": "第三方平台原则上不得自行开展的业务包括（　）。", "options": ["A. 销售、承保", "B. 理赔、退保", "C. 投诉处理和客户服务", "D. 提供技术辅助"], "answer": ["A", "B", "C"], "explanation": "第三方平台原则上只能提供技术辅助，不得自行开展销售、承保、理赔、退保、投诉处理和客户服务。", "pitfall": "易错点第15条：平台不能因为提供流量或技术就自行从事保险销售和理赔。"}, {"id": "M09-Q08", "type": "multiple", "stem": "投保申请、保费收取、保单确认等核心行为应当在（　）完成。", "options": ["A. 保险机构的自营平台", "B. 保险中介机构的自营平台", "C. 任意第三方平台", "D. 从业人员个人社交账号"], "answer": ["A", "B"], "explanation": "核心行为应在保险机构或保险中介机构的自营平台完成。"}, {"id": "M09-Q09", "type": "single", "stem": "互联网保险的运营管理方式是（　）。", "options": ["A. 由各分支机构分别运营", "B. 由总公司或法人机构统一集中运营、统一管理", "C. 由第三方平台运营", "D. 由销售人员个人运营"], "answer": "B", "explanation": "互联网保险由总公司或法人机构统一集中运营、统一管理；总公司可授权部分职能，但仍对被授权机构行为负责。"}, {"id": "M09-Q10", "type": "judge", "stem": "总公司授权分支机构承担部分互联网保险职能后，总公司不再对被授权机构的行为负责。", "options": ["对", "错"], "answer": "错", "explanation": "总公司可授权部分职能，但仍对被授权机构行为负责。"}]}, {"id": "M09-KP03", "title": "网络营销合规", "summary": "未取得相应金融业务资质的机构或个人，不得开展或变相开展金融产品网络营销。宣传页面应披露保险产品全称、承保公司全称及提供销售/经纪服务的中介机构全称。互联网销售仍需履行产品说明、免责提示、信息披露、销售可回溯和全流程线上服务要求。", "questions": [{"id": "M09-Q11", "type": "judge", "stem": "未取得相应金融业务资质的机构或个人，不得开展或变相开展金融产品网络营销。", "options": ["对", "错"], "answer": "对", "explanation": "这是网络营销合规的底线要求。"}, {"id": "M09-Q12", "type": "multiple", "stem": "互联网保险宣传页面应当披露的名称包括（　）。", "options": ["A. 保险产品全称", "B. 承保公司全称", "C. 提供销售/经纪服务的中介机构全称", "D. 销售人员个人昵称"], "answer": ["A", "B", "C"], "explanation": "应披露产品全称、承保公司全称及中介机构全称。"}, {"id": "M09-Q13", "type": "multiple", "stem": "互联网销售仍然必须履行的要求包括（　）。", "options": ["A. 产品说明、免责提示", "B. 信息披露", "C. 销售可回溯", "D. 全流程线上服务"], "answer": ["A", "B", "C", "D"], "explanation": "上述四项要求线上销售同样适用。"}]}, {"id": "M09-KP04", "title": "销售合规与四项红线", "summary": "销售行为覆盖售前宣传、售中推介、售后回访，应实现人员、行为和事后追溯的全生命周期管理。三项行动要求：讲得到位、留得住痕、经得起查。四条销售红线：不得虚假宣传、夸大保障或承诺收益/赔付；不得低价恶性竞争或违规返佣；不得代签名、伪造业务资料；不得泄露或滥用客户隐私信息。", "questions": [{"id": "M09-Q14", "type": "multiple", "stem": "销售行为覆盖的环节包括（　）。", "options": ["A. 售前宣传", "B. 售中推介", "C. 售后回访", "D. 仅投保环节"], "answer": ["A", "B", "C"], "explanation": "销售行为覆盖售前宣传、售中推介、售后回访全过程。"}, {"id": "M09-Q15", "type": "multiple", "stem": "销售合规的三项行动要求是（　）。", "options": ["A. 讲得到位", "B. 留得住痕", "C. 经得起查", "D. 卖得最多"], "answer": ["A", "B", "C"], "explanation": "三项行动要求：讲得到位、留得住痕、经得起查。"}, {"id": "M09-Q16", "type": "multiple", "stem": "四条销售红线包括（　）。", "options": ["A. 不得虚假宣传、夸大保障或承诺收益/赔付", "B. 不得低价恶性竞争或违规返佣", "C. 不得代签名、伪造业务资料", "D. 不得泄露或滥用客户隐私信息"], "answer": ["A", "B", "C", "D"], "explanation": "四条红线即为上述四项。"}, {"id": "M09-Q17", "type": "judge", "stem": "销售人员可以在核保完成前向客户承诺“已经承保”。", "options": ["对", "错"], "answer": "错", "explanation": "销售人员不能自行承诺必赔；核保完成前不能承诺已经承保；核赔完成前不能承诺具体赔款。", "pitfall": "易错点第18条，属高频考点。"}]}, {"id": "M09-KP05", "title": "“报行合一”与“见费出单”", "summary": "报行合一：条款、费率、手续费、保单执行、财务核算和报表数据应与监管备案及实际执行保持一致。见费出单：保费应按规定及时、足额入账后出单，防范应收保费、资金挪用和坏账风险。不得通过返现、赠送实物、价外折扣、虚列宣传费或技术服务费等方式变相调价或支付手续费。", "questions": [{"id": "M09-Q18", "type": "single", "stem": "“报行合一”强调的核心是（　）。", "options": ["A. 保费资金真实入账", "B. 条款、费率、手续费、保单执行、财务核算和报表数据应与监管备案及实际执行保持一致", "C. 销售队伍快速扩张", "D. 理赔快速结案"], "answer": "B", "explanation": "报行合一强调备案、执行、核算和数据一致。", "pitfall": "易错点第17条：报行合一 vs 见费出单，二者强调的重点不同，极易互换。"}, {"id": "M09-Q19", "type": "single", "stem": "“见费出单”强调的是（　）。", "options": ["A. 条款备案一致", "B. 保费资金真实入账后出单", "C. 保单格式统一", "D. 核保权限集中"], "answer": "B", "explanation": "见费出单强调保费按规定及时、足额入账后出单，防范应收保费、资金挪用和坏账风险。"}, {"id": "M09-Q20", "type": "multiple", "stem": "下列属于变相调价或变相支付手续费方式的有（　）。", "options": ["A. 返现", "B. 赠送实物", "C. 价外折扣", "D. 虚列宣传费或技术服务费"], "answer": ["A", "B", "C", "D"], "explanation": "上述方式均属违规变相调价或支付手续费。"}, {"id": "M09-Q21", "type": "judge", "stem": "通过虚列技术服务费的方式向渠道支付额外费用，属于合规的商务安排。", "options": ["对", "错"], "answer": "错", "explanation": "虚列费用属于变相支付手续费，是明确的违规行为。"}]}, {"id": "M09-KP06", "title": "非车险六条红线", "summary": "①未使用经批准或备案的条款费率，或擅自增删责任、调整费率；②虚列、套取或变相支付费用；③销售误导、夸大或虚假宣传；④跨区域、异地违规经营；⑤理赔拖延或责任判断不严谨；⑥数据、业务和档案不真实、不可追溯。遇到不确定事项：先停、先问、先记录。", "questions": [{"id": "M09-Q22", "type": "multiple", "stem": "非车险六条红线包括（　）。", "options": ["A. 未使用经批准或备案的条款费率，或擅自增删责任、调整费率", "B. 虚列、套取或变相支付费用", "C. 销售误导、夸大或虚假宣传", "D. 跨区域、异地违规经营；理赔拖延；数据档案不真实不可追溯"], "answer": ["A", "B", "C", "D"], "explanation": "以上即为非车险六条红线。"}, {"id": "M09-Q23", "type": "single", "stem": "遇到不确定事项时，应当遵循的处理原则是（　）。", "options": ["A. 先做、后补、再汇报", "B. 先停、先问、先记录", "C. 先签单、后核保", "D. 先承诺、后解释"], "answer": "B", "explanation": "遇到不确定事项：先停、先问、先记录。", "pitfall": "四个字的口诀顺序易被改动设坑。"}, {"id": "M09-Q24", "type": "judge", "stem": "擅自增删保险责任或调整费率属于非车险红线行为。", "options": ["对", "错"], "answer": "对", "explanation": "必须使用经批准或备案的条款费率，不得擅自增删责任、调整费率。"}]}]}, {"id": "M10", "name": "财务、投资、再保险与精算知识", "source": "鼎和保险培训知识点汇总.pdf（第八部分）", "knowledgePoints": [{"id": "M10-KP01", "title": "保险公司盈利逻辑与财务报表指标", "summary": "保险公司依靠承保＋投资“双轮驱动”。承保端通过业务结构、定价、赔付和费用管理实现承保利润，同时形成经营性现金流；投资端运用保费沉淀资金和自有资金，在安全、流动和匹配的前提下获取收益。财务报表至少包括资产负债表、利润表、现金流量表、所有者权益变动表和附注。综合成本率＝综合赔付率＋综合费用率；承保利润率＝1－综合成本率；未到期责任准备金对应尚未履行的保障责任，未决赔款准备金对应已经出险但尚未结案的赔付义务；预算管理理念：有预算不超支，无预算不开支；预算分解流程：一上、一下、二上、二下；“1343”考核体系：一个一体协同、三类考核、PDCA四环节、三项支撑。", "questions": [{"id": "M10-Q01", "type": "single", "stem": "保险公司的盈利模式可概括为（　）。", "options": ["A. 单一承保驱动", "B. 承保＋投资“双轮驱动”", "C. 单一投资驱动", "D. 单一费用驱动"], "answer": "B", "explanation": "保险公司依靠承保端和投资端“双轮驱动”实现盈利。"}, {"id": "M10-Q02", "type": "single", "stem": "综合成本率的计算公式是（　）。", "options": ["A. 综合赔付率－综合费用率", "B. 综合赔付率＋综合费用率", "C. 1－综合赔付率", "D. 保费收入/赔款支出"], "answer": "B", "explanation": "综合成本率＝综合赔付率＋综合费用率。"}, {"id": "M10-Q03", "type": "single", "stem": "若某公司综合成本率为98%，则其承保利润率为（　）。", "options": ["A. 2%", "B. 98%", "C. 1%", "D. －2%"], "answer": "A", "explanation": "承保利润率＝1－综合成本率＝1－98%＝2%。", "pitfall": "考试常给出综合成本率让算承保利润率，注意是“1－”。"}, {"id": "M10-Q04", "type": "single", "stem": "对应“已经出险但尚未结案的赔付义务”的准备金是（　）。", "options": ["A. 未到期责任准备金", "B. 未决赔款准备金", "C. 责任准备金", "D. 公积金"], "answer": "B", "explanation": "未决赔款准备金对应已经出险但尚未结案的赔付义务；未到期责任准备金对应尚未履行的保障责任。", "pitfall": "两类准备金的对应关系极易互换。"}, {"id": "M10-Q05", "type": "judge", "stem": "收到保费即等同于形成已赚保费。", "options": ["对", "错"], "answer": "错", "explanation": "已赚保费强调保障责任已经履行的部分，不等于当期收到的全部保费。", "pitfall": "易错点第19条，属高频判断题。"}, {"id": "M10-Q06", "type": "multiple", "stem": "财务报表至少应当包括（　）。", "options": ["A. 资产负债表", "B. 利润表", "C. 现金流量表、所有者权益变动表", "D. 附注"], "answer": ["A", "B", "C", "D"], "explanation": "财务报表至少包括上述各表及附注。"}, {"id": "M10-Q07", "type": "single", "stem": "预算管理的理念是（　）。", "options": ["A. 有预算不超支，无预算不开支", "B. 先开支后补预算", "C. 预算可灵活突破", "D. 有预算尽量花完"], "answer": "A", "explanation": "预算管理理念：有预算不超支，无预算不开支。"}, {"id": "M10-Q08", "type": "single", "stem": "预算分解流程是（　）。", "options": ["A. 一上、一下、二上、二下", "B. 一上、二上、一下、二下", "C. 上报、审批、执行、考核", "D. 编制、审核、下达、反馈"], "answer": "A", "explanation": "预算分解流程：一上、一下、二上、二下。"}, {"id": "M10-Q09", "type": "single", "stem": "“1343”考核体系中的“1”指的是（　）。", "options": ["A. 一个一体协同", "B. 一类考核", "C. 一个目标", "D. 一个部门"], "answer": "A", "explanation": "“1343”：一个一体协同、三类考核、PDCA四环节、三项支撑。"}]}, {"id": "M10-KP02", "title": "保险资金运用", "summary": "三大资金来源：自有资金、准备金、流动资金。三大特点：长期性、规模性、稳定性。四项原则：安全性、流动性、收益性、资产负债匹配。第一性原理是资产负债匹配：期限匹配、成本收益匹配、流动性匹配。五类资产：流动性资产、固定收益类资产、权益类资产、不动产类资产、其他金融产品。监管要求：保险资金应由法人机构统一管理，分支机构不得从事资金运用业务；投资资产实行第三方托管；托管账户专户专用。主流配置呈“哑铃型”：固定收益类作为稳健基石，权益及另类资产作为收益增强部分。", "questions": [{"id": "M10-Q10", "type": "multiple", "stem": "保险资金的三大来源是（　）。", "options": ["A. 自有资金", "B. 准备金", "C. 流动资金", "D. 银行贷款"], "answer": ["A", "B", "C"], "explanation": "三大资金来源：自有资金、准备金、流动资金。"}, {"id": "M10-Q11", "type": "multiple", "stem": "保险资金运用的四项原则是（　）。", "options": ["A. 安全性", "B. 流动性", "C. 收益性", "D. 资产负债匹配"], "answer": ["A", "B", "C", "D"], "explanation": "四项原则：安全性、流动性、收益性、资产负债匹配。"}, {"id": "M10-Q12", "type": "single", "stem": "保险资金运用的第一性原理是（　）。", "options": ["A. 收益最大化", "B. 资产负债匹配", "C. 规模最大化", "D. 短期套利"], "answer": "B", "explanation": "资产负债匹配是保险资金运用的第一性原理，包括期限匹配、成本收益匹配、流动性匹配。", "pitfall": "易错点第20条：保险资金首先考虑安全、流动和资产负债匹配，然后才追求收益。"}, {"id": "M10-Q13", "type": "multiple", "stem": "资产负债匹配包括（　）。", "options": ["A. 期限匹配", "B. 成本收益匹配", "C. 流动性匹配", "D. 人员匹配"], "answer": ["A", "B", "C"], "explanation": "三重匹配：期限匹配、成本收益匹配、流动性匹配。"}, {"id": "M10-Q14", "type": "multiple", "stem": "保险资金可投资的五类资产包括（　）。", "options": ["A. 流动性资产、固定收益类资产", "B. 权益类资产", "C. 不动产类资产", "D. 其他金融产品"], "answer": ["A", "B", "C", "D"], "explanation": "五类资产即为上述五类。"}, {"id": "M10-Q15", "type": "judge", "stem": "保险公司的分支机构可以自行从事保险资金运用业务。", "options": ["对", "错"], "answer": "错", "explanation": "保险资金应由法人机构统一管理，分支机构不得从事资金运用业务。"}, {"id": "M10-Q16", "type": "judge", "stem": "保险资金投资资产实行第三方托管，托管账户专户专用。", "options": ["对", "错"], "answer": "对", "explanation": "监管要求投资资产实行第三方托管，托管账户专户专用。"}, {"id": "M10-Q17", "type": "single", "stem": "主流保险资金配置呈现的形态被称为（　）。", "options": ["A. 金字塔型", "B. 哑铃型", "C. 倒三角型", "D. 纺锤型"], "answer": "B", "explanation": "呈现“哑铃型”：固定收益类作为稳健基石，权益及另类资产作为收益增强部分。"}, {"id": "M10-Q18", "type": "multiple", "stem": "保险资金的三大特点是（　）。", "options": ["A. 长期性", "B. 规模性", "C. 稳定性", "D. 投机性"], "answer": ["A", "B", "C"], "explanation": "三大特点：长期性、规模性、稳定性。"}]}, {"id": "M10-KP03", "title": "再保险", "summary": "再保险也叫分保，是“保险的保险”，是原保险风险的第二次分散。再保险基础是原保险，但再保险合同独立于原保险；原投保人与再保险人没有直接法律关系。四项主要作用：分散风险、扩大承保能力、稳定经营结果、保护偿付能力。共保与再保险区别：共保是多家保险人直接共同承保，投保人与各共保人存在直接关系；再保险是原保险人承保后再向再保人转移风险。合约再保险：合同范围内业务自动分出、自动接受，双方均受合约约束。临时再保险：针对单个保单或危险单位逐笔协商，双方均有选择权。比例再保险：成数再保险（每笔业务按固定比例分出）、溢额再保险（先保留自留额，超过部分按线数分出）、成数溢额混合。非比例再保险：险位超赔、事故/巨灾超赔、止损超赔。危险单位：一次事故可能波及的最大损失范围。巨灾时间条款：不同灾因可能适用72小时或168小时等口径。", "questions": [{"id": "M10-Q19", "type": "single", "stem": "再保险被称为（　）。", "options": ["A. 保险的保险", "B. 保险的补充", "C. 保险的替代", "D. 保险的衍生"], "answer": "A", "explanation": "再保险也叫分保，是“保险的保险”，是原保险风险的第二次分散。"}, {"id": "M10-Q20", "type": "judge", "stem": "原投保人与再保险人之间存在直接的合同法律关系。", "options": ["对", "错"], "answer": "错", "explanation": "再保险合同独立于原保险，原投保人与再保险人没有直接法律关系。", "pitfall": "易错点第13条：再保险是风险的第二次分散，原投保人与再保险人无直接合同关系。"}, {"id": "M10-Q21", "type": "multiple", "stem": "再保险的四项主要作用是（　）。", "options": ["A. 分散风险", "B. 扩大承保能力", "C. 稳定经营结果", "D. 保护偿付能力"], "answer": ["A", "B", "C", "D"], "explanation": "四项主要作用即为上述四项。"}, {"id": "M10-Q22", "type": "single", "stem": "合同范围内的业务自动分出、自动接受，双方均受合约约束，这种再保险形式是（　）。", "options": ["A. 临时再保险", "B. 合约再保险", "C. 共保", "D. 成数再保险"], "answer": "B", "explanation": "合约再保险业务自动分出、自动接受，双方均受合约约束。", "pitfall": "易错点第14条：合约再保险自动、持续；临时再保险逐笔协商、双方可选择。"}, {"id": "M10-Q23", "type": "single", "stem": "针对单个保单或危险单位逐笔协商，双方均有选择权的再保险形式是（　）。", "options": ["A. 合约再保险", "B. 临时再保险", "C. 溢额再保险", "D. 成数再保险"], "answer": "B", "explanation": "临时再保险逐笔协商，多用于巨额、特殊或超过合约能力的风险。"}, {"id": "M10-Q24", "type": "single", "stem": "每笔业务按固定比例分出保费和赔款的再保险方式是（　）。", "options": ["A. 成数再保险", "B. 溢额再保险", "C. 险位超赔", "D. 止损超赔"], "answer": "A", "explanation": "成数再保险按固定比例分出；溢额再保险先保留自留额，超过部分按线数分出。"}, {"id": "M10-Q25", "type": "single", "stem": "先保留自留额、超过部分按线数分出的比例再保险方式是（　）。", "options": ["A. 成数再保险", "B. 溢额再保险", "C. 事故超赔", "D. 成数溢额混合"], "answer": "B", "explanation": "溢额再保险以自留额为基础，超过部分按线数分出。"}, {"id": "M10-Q26", "type": "multiple", "stem": "非比例再保险的典型形式包括（　）。", "options": ["A. 险位超赔", "B. 事故/巨灾超赔", "C. 止损超赔", "D. 成数再保险"], "answer": ["A", "B", "C"], "explanation": "非比例再保险以损失金额为基础，超过起赔点后由再保人承担，典型包括险位超赔、事故/巨灾超赔、止损超赔。"}, {"id": "M10-Q27", "type": "single", "stem": "共保与再保险的核心区别在于（　）。", "options": ["A. 共保只适用于车险", "B. 共保中投保人与各共保人存在直接关系；再保险中原保险人承保后再向再保人转移风险", "C. 再保险不需要签订合同", "D. 共保属于非比例再保险"], "answer": "B", "explanation": "共保是多家保险人直接共同承保；再保险是原保险人承保后再向再保人转移风险。"}, {"id": "M10-Q28", "type": "single", "stem": "“一次事故可能波及的最大损失范围”称为（　）。", "options": ["A. 保额", "B. 危险单位", "C. 自留额", "D. 分保比例"], "answer": "B", "explanation": "危险单位即一次事故可能波及的最大损失范围。"}, {"id": "M10-Q29", "type": "judge", "stem": "巨灾时间条款用于划分“一次事故”，不同灾因可能适用72小时或168小时等口径，具体以再保合同为准。", "options": ["对", "错"], "answer": "对", "explanation": "巨灾时间条款的口径以再保合同约定为准。"}]}, {"id": "M10-KP04", "title": "精算与偿付能力", "summary": "产品定价：预测未来赔付成本并确定充足、合理的费率。定价回溯：比较实际经营结果与定价假设，识别亏损业务并调整模型或费率。准备金评估：为尚未履行的保险责任和未决赔款预留资金，遵循客观、谨慎、充足、合理原则。偿付能力：保险公司履行对保单持有人赔付义务的能力。“偿二代”三支柱：第一支柱定量资本要求（保险、市场、信用等可量化风险）；第二支柱定性监管要求（操作、战略、声誉、流动性等风险及SARMRA）；第三支柱市场约束（信息披露、信用评级等监督）。", "questions": [{"id": "M10-Q30", "type": "single", "stem": "偿付能力是指（　）。", "options": ["A. 公司的盈利能力", "B. 保险公司履行对保单持有人赔付义务的能力", "C. 公司的资产规模", "D. 公司的市场份额"], "answer": "B", "explanation": "偿付能力是保险公司履行对保单持有人赔付义务的能力。"}, {"id": "M10-Q31", "type": "single", "stem": "准备金评估应遵循的原则是（　）。", "options": ["A. 客观、谨慎、充足、合理", "B. 激进、乐观、充分", "C. 保守、节约", "D. 自由裁量"], "answer": "A", "explanation": "准备金评估遵循客观、谨慎、充足、合理原则。"}, {"id": "M10-Q32", "type": "single", "stem": "“偿二代”第二支柱主要关注（　）。", "options": ["A. 定量资本要求", "B. 定性监管要求及SARMRA", "C. 市场约束", "D. 信息披露"], "answer": "B", "explanation": "第二支柱为定性监管要求，关注操作、战略、声誉、流动性等风险及SARMRA。"}, {"id": "M10-Q33", "type": "single", "stem": "“偿二代”第三支柱依靠（　）实施市场约束。", "options": ["A. 资本充足率计算", "B. 信息披露、信用评级等监督", "C. 现场检查", "D. 罚款"], "answer": "B", "explanation": "第三支柱为市场约束，依靠信息披露、信用评级等监督。"}, {"id": "M10-Q34", "type": "single", "stem": "“偿二代”第一支柱关注的风险类型是（　）。", "options": ["A. 操作、战略、声誉风险", "B. 保险、市场、信用等可量化风险", "C. 流动性风险", "D. 政治风险"], "answer": "B", "explanation": "第一支柱为定量资本要求，关注保险、市场、信用等可量化风险。"}, {"id": "M10-Q35", "type": "single", "stem": "比较实际经营结果与定价假设，识别亏损业务并调整模型或费率，这一精算工作是（　）。", "options": ["A. 产品定价", "B. 定价回溯", "C. 准备金评估", "D. 偿付能力管理"], "answer": "B", "explanation": "定价回溯即比较实际经营结果与定价假设，识别亏损业务并调整模型或费率。"}]}]}, {"id": "M11", "name": "高频数字、易错点与考前速记", "source": "鼎和保险培训知识点汇总.pdf（第九~十一部分）", "knowledgePoints": [{"id": "M11-KP01", "title": "高频数字与时效信息", "summary": "2008年5月成立；2021年完成增资引战、成立国内首家新型电力系统保险研究中心；2025年研究中心升级为新型电力系统金融与保险研究院；2030/2060碳达峰/碳中和；课件口径注册资本60亿元；交强险综改后总责任限额由12.2万元提高至20万元，商业三者险责任限额范围由5—500万元扩大至10—1000万元；NCD无赔款优待系数计算周期由1年扩展至3年；互联网保险2013—2023年保费规模由290亿元增长至4948.6亿元，年复合增长率32.8%；单一资产原则上不超过上季末总资产5%，单一法人主体合计原则上不高于20%。", "questions": [{"id": "M11-Q01", "type": "single", "stem": "交强险综改后，总责任限额由12.2万元提高至（　）。", "options": ["A. 15万元", "B. 20万元", "C. 25万元", "D. 30万元"], "answer": "B", "explanation": "交强险综改后总责任限额由12.2万元提高至20万元。"}, {"id": "M11-Q02", "type": "single", "stem": "交强险综改后，商业三者险责任限额范围由5—500万元扩大至（　）。", "options": ["A. 5—1000万元", "B. 10—1000万元", "C. 10—500万元", "D. 20—2000万元"], "answer": "B", "explanation": "商业三者险责任限额范围由5—500万元扩大至10—1000万元。", "pitfall": "下限由5万变为10万，上限由500万变为1000万，两个数字都要记准。"}, {"id": "M11-Q03", "type": "single", "stem": "NCD无赔款优待系数的计算周期由1年扩展至（　）。", "options": ["A. 2年", "B. 3年", "C. 5年", "D. 10年"], "answer": "B", "explanation": "NCD计算周期由1年扩展至3年。"}, {"id": "M11-Q04", "type": "single", "stem": "国内首家新型电力系统保险研究中心于（　）成立。", "options": ["A. 2018年", "B. 2021年", "C. 2023年", "D. 2025年"], "answer": "B", "explanation": "2021年完成增资引战，同时成立国内首家新型电力系统保险研究中心。"}, {"id": "M11-Q05", "type": "single", "stem": "新型电力系统保险研究中心升级为新型电力系统金融与保险研究院是在（　）。", "options": ["A. 2021年", "B. 2023年", "C. 2025年", "D. 2026年"], "answer": "C", "explanation": "2025年研究中心升级为新型电力系统金融与保险研究院。", "pitfall": "2021年成立研究中心、2025年升级为研究院，两个年份易混。"}, {"id": "M11-Q06", "type": "single", "stem": "保险资金投资中，单一资产原则上不超过上季末总资产的（　）。", "options": ["A. 5%", "B. 10%", "C. 20%", "D. 30%"], "answer": "A", "explanation": "单一资产原则上不超过上季末总资产5%；单一法人主体合计原则上不高于20%。", "pitfall": "5%与20%两个集中度指标容易互换。"}, {"id": "M11-Q07", "type": "single", "stem": "保险资金投资中，对单一法人主体的投资合计原则上不高于（　）。", "options": ["A. 5%", "B. 10%", "C. 20%", "D. 50%"], "answer": "C", "explanation": "单一法人主体合计原则上不高于20%。"}, {"id": "M11-Q08", "type": "single", "stem": "互联网保险保费规模由2013年的290亿元增长至2023年的（　）。", "options": ["A. 1948.6亿元", "B. 3948.6亿元", "C. 4948.6亿元", "D. 5948.6亿元"], "answer": "C", "explanation": "2013—2023年保费规模由290亿元增长至4948.6亿元，课件口径年复合增长率32.8%。"}, {"id": "M11-Q09", "type": "judge", "stem": "公司注册资本、机构数量、员工人数、行业排名等数字具有一定的时效性，复习时应以最新正式材料为准。", "options": ["对", "错"], "answer": "对", "explanation": "上述数字随统计年度和口径变化，脱离年份单独记忆存在风险。"}, {"id": "M11-Q10", "type": "single", "stem": "若某公司资料中注册资本出现60亿元与46.43亿元两个口径，正确的处理方式是（　）。", "options": ["A. 一律采用较小数值", "B. 若考当前公司概况采用较新的正式公司材料；若题目注明年份则按该年份计算", "C. 取两者平均值", "D. 两个数值都错"], "answer": "B", "explanation": "46.43亿元是截至2024年末的资本金数据，属于资本金口径冲突，应按题干年份或最新材料处理。"}, {"id": "M11-Q11", "type": "single", "stem": "法定承保能力的计算公式是（　）。", "options": ["A. （资本金＋公积金）×10%", "B. （资本金＋公积金）×20%", "C. 资本金×10%", "D. 公积金×10%"], "answer": "A", "explanation": "法定承保能力＝（资本金＋公积金）×10%。不同资料因年度不同曾算出10.128亿元和9.469亿元，数值必须对应具体时点。", "pitfall": "记忆公式，不要死记数值。"}]}, {"id": "M11-KP02", "title": "易错点集中辨析", "summary": "20条易错点：①企业定位vs企业愿景；②三个同心圆对应关系；③“211”是两库一台一圈；④“品牌与信任”合为一个支柱；⑤近因非时间最近；⑥财产险事故时需保险利益／人身险订立时需保险利益；⑦损失补偿不允许获利，代位求偿是派生规则；⑧一切险不等于一切损失都赔；⑨信用险权利人投保、保证险义务人投保；⑩核保控制风险进入、核赔控制损失兑现；⑪交强险强制、商业车险自愿；⑫先交强险后商业三者险；⑬再保险是第二次分散，原投保人与再保险人无直接关系；⑭合约再保险自动持续、临时再保险逐笔协商；⑮平台不能因提供流量或技术而自行从事保险销售和理赔；⑯互联网保险判断关键在于能否独立了解并自主投保；⑰报行合一vs见费出单；⑱不得承诺必赔/已承保/具体赔款；⑲收到保费≠已赚保费；⑳保险资金先安全流动匹配，后追求收益。", "questions": [{"id": "M11-Q12", "type": "judge", "stem": "收到保费即等同于形成已赚保费，应全额计入当期收入。", "options": ["对", "错"], "answer": "错", "explanation": "收到保费不等于立即全部形成已赚保费，应随保障责任履行确认。"}, {"id": "M11-Q13", "type": "judge", "stem": "保险资金运用应先考虑安全、流动和资产负债匹配，然后才追求收益。", "options": ["对", "错"], "answer": "对", "explanation": "这是保险资金运用的基本顺序。"}, {"id": "M11-Q14", "type": "single", "stem": "下列表述错误的是（　）。", "options": ["A. 企业定位是能源行业保险专家", "B. 企业愿景是成为国内一流、国际知名保险公司", "C. “品牌”与“信任”是两个独立的关键支柱", "D. 近因不一定是时间上最近的原因"], "answer": "C", "explanation": "“品牌与信任”合并为一个支柱，故治企理念称“五个关键支柱”。", "pitfall": "本题为“选错误项”题型，注意审题方向与实际记忆相反。"}, {"id": "M11-Q15", "type": "single", "stem": "下列关于核保与核赔的表述，正确的是（　）。", "options": ["A. 核保控制损失兑现，核赔控制风险进入", "B. 核保控制风险进入，核赔控制损失兑现", "C. 两者均控制风险进入", "D. 两者均控制损失兑现"], "answer": "B", "explanation": "核保控制风险进入，核赔控制损失兑现。"}, {"id": "M11-Q16", "type": "judge", "stem": "信用险通常由义务人投保，保证险通常由权利人投保。", "options": ["对", "错"], "answer": "错", "explanation": "恰好相反：信用险由权利人投保，保证险由义务人投保。"}, {"id": "M11-Q17", "type": "judge", "stem": "互联网平台只要提供了流量和技术支持，就可以自行从事保险销售和理赔。", "options": ["对", "错"], "answer": "错", "explanation": "第三方平台原则上只能提供技术辅助，不得自行开展销售、承保、理赔等业务。"}, {"id": "M11-Q18", "type": "single", "stem": "下列关于交强险与商业车险的表述，正确的是（　）。", "options": ["A. 两者都是强制保险", "B. 交强险强制、商业车险自愿", "C. 两者都是自愿保险", "D. 商业车险强制、交强险自愿"], "answer": "B", "explanation": "交强险国家强制投保，商业车险为自愿投保。"}, {"id": "M11-Q19", "type": "judge", "stem": "“打造新型电力系统风险管理生态圈”是企业愿景的规范表述。", "options": ["对", "错"], "answer": "错", "explanation": "企业愿景应为“成为国内一流、国际知名保险公司”；“打造新型电力系统风险管理生态圈”是能源业务或“211”工程的战略目标。"}, {"id": "M11-Q20", "type": "single", "stem": "下列情形属于“承诺越界”的是（　）。", "options": ["A. 向客户说明条款内容", "B. 在核赔完成前向客户承诺具体赔款金额", "C. 提示客户认真阅读免责条款", "D. 说明等待期和健康告知要求"], "answer": "B", "explanation": "销售人员不能自行承诺必赔；核保完成前不能承诺已经承保；核赔完成前不能承诺具体赔款。"}]}, {"id": "M11-KP03", "title": "考前最后速记（口号与框架）", "summary": "定位：能源行业保险专家；使命：为更加清洁的美好生活提供专业风险管理；愿景：成为国内一流、国际知名保险公司；主线：夯基础、练内功、拓圈子；路径：植根南网、做强能源、做大市场；同心圆：电网、能源、市场；五支柱：员工、流程、客户、产品、品牌与信任；211：风险库、产品库；生态平台；生态圈；工作理念：高、严、细、实、快；品牌形象：一言九鼎、和谐共赢。四项核心原则：保险利益、最大诚信、近因、损失补偿；可保风险六条件；意外四要素；非车险流程；销售八步；六查。", "questions": [{"id": "M11-Q21", "type": "multiple", "stem": "下列属于必背口号与框架的有（　）。", "options": ["A. 定位：能源行业保险专家", "B. 使命：为更加清洁的美好生活提供专业风险管理", "C. 主线：夯基础、练内功、拓圈子", "D. 路径：植根南网、做强能源、做大市场"], "answer": ["A", "B", "C", "D"], "explanation": "上述均为必背的口号与框架内容。"}, {"id": "M11-Q22", "type": "short", "stem": "请默写鼎和保险的定位、使命、愿景、工作主线与发展路径。", "answer": "定位：能源行业保险专家；使命：为更加清洁的美好生活提供专业风险管理；愿景：成为国内一流、国际知名保险公司；工作主线：夯基础、练内功、拓圈子；发展路径：植根南网、做强能源、做大市场。", "explanation": "此五句是必背核心，考试出现频率极高。"}, {"id": "M11-Q23", "type": "short", "stem": "请简述非车险业务的完整流程（从需求到追偿）。", "answer": "非车险流程：需求（客户需求摸排）—询价—核保—出单—报案—查勘—定责定损—理算核赔—支付追偿。承保阶段为业务申报、核保审核、出单、批改、档案管理；理赔阶段为报案受理、查勘、立案估损、定责、定损、理算、核赔支付、追偿归档。", "explanation": "答题要点：承保五步 + 理赔八步，能串成一条主线即可。"}, {"id": "M11-Q24", "type": "short", "stem": "请写出四项核心保险原则与可保风险六条件，并说明代位求偿的归属。", "answer": "四项核心原则：保险利益、最大诚信、近因、损失补偿。可保风险六条件：随机、明确、重大、可预测、非巨灾、同质。代位求偿（以及重复保险分摊）属于损失补偿原则的派生规则。", "explanation": "答题要点：四核心 + 六条件 + 两派生（代位求偿、重复保险分摊）。"}, {"id": "M11-Q25", "type": "short", "stem": "请写出意外险中“意外”的四要素，并各举一个不属于意外的情形。", "answer": "意外四要素：外来的、突发的、非本意的、非疾病的。不属于意外的常见情形：猝死（疾病导致）、中暑（疾病/环境因素）、醉酒或吸毒后发生的事故、无证驾驶、高风险运动等（最终以条款为准）。", "explanation": "答题要点：四要素齐全 + 合理举例并注明以条款为准。"}, {"id": "M11-Q26", "type": "multiple", "stem": "一线工作“六查”包括（　）。", "options": ["A. 真实性、资料", "B. 条款费率", "C. 授权", "D. 告知与留痕"], "answer": ["A", "B", "C", "D"], "explanation": "六查：业务真实性、资料、条款费率、授权、告知、全过程留痕。"}, {"id": "M11-Q27", "type": "multiple", "stem": "销售八步的速记顺序包括（　）。", "options": ["A. 获客、诊断", "B. 方案、洽谈", "C. 投标资料、承保出单", "D. 风控服务、续保经营"], "answer": ["A", "B", "C", "D"], "explanation": "销售八步速记：获客—诊断—方案—洽谈—投标资料—承保出单—风控服务—续保经营。"}]}]}]};
const TNAME = {single:'单选', multiple:'多选', judge:'判断', short:'简答'};
const KEY = 'dinghe-quiz-v1';

/* ---------- 展平题库 ---------- */
const ALL = [];
DATA.modules.forEach(m => m.knowledgePoints.forEach(k => k.questions.forEach(q => ALL.push({
  mid:m.id, mname:m.name, kpid:k.id, kptitle:k.title, kpsummary:k.summary, q
}))));
const IDX = {}; ALL.forEach((it,i)=>IDX[it.q.id]=i);

/* ---------- 状态 ---------- */
let S = { answers:{}, mod:'all', type:'all', wrongOnly:false, shuffle:false, order:null, idx:0 };
try{ const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s) S=Object.assign(S,s); }catch(e){}
const save = ()=>{ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };

let view = [];        // 当前筛选后的题目
let sel = [];         // 当前题已选项
let revealed = false; // 当前题是否已揭晓
let navMode = 'list';
let shortRevealed = false;   // 简答题：参考答案是否已揭晓（等待自评）

/* ---------- 工具 ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ansText = q => q.type==='multiple' ? q.answer.join('') : String(q.answer);
const rec = id => S.answers[id];
const isWrong = id => { const r=rec(id); return !!r && !r.correct; };
const isDone = id => !!rec(id);
const keyOf = o => o.trim().charAt(0);

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1600);
}

/* ---------- 构建视图 ---------- */
function buildView(){
  shortRevealed = false;
  view = ALL.filter(it=>{
    if(S.mod!=='all' && it.mid!==S.mod) return false;
    if(S.type!=='all' && it.q.type!==S.type) return false;
    if(S.wrongOnly && !isWrong(it.q.id)) return false;
    return true;
  });
  if(S.order){
    const rank={}; S.order.forEach((id,i)=>rank[id]=i);
    view.sort((a,b)=>(rank[a.q.id]??1e9)-(rank[b.q.id]??1e9));
  }
  if(S.idx>=view.length) S.idx=Math.max(0,view.length-1);
  if(S.idx<0) S.idx=0;
}

/* ---------- 统计 ---------- */
function stats(){
  let done=0, right=0, wrong=0;
  ALL.forEach(it=>{ const r=rec(it.q.id); if(r){ done++; r.correct?right++:wrong++; } });
  const scopeDone = view.filter(it=>isDone(it.q.id)).length;
  const scopeRight = view.filter(it=>{const r=rec(it.q.id);return r&&r.correct;}).length;
  return {done, right, wrong, total:ALL.length, acc: done? right/done*100 : null,
          scopeDone, scopeRight, scopeAcc: scopeDone? scopeRight/scopeDone*100 : null};
}

/* ---------- 渲染 ---------- */
function renderHeader(){
  const st = stats();
  document.getElementById('kProg').textContent = (st.total? st.done/st.total*100 : 0).toFixed(1)+'%';
  document.getElementById('kDone').textContent = st.done+'/'+st.total;
  document.getElementById('kAcc').textContent = st.acc===null ? '—' : st.acc.toFixed(1)+'%';
  document.getElementById('kWrong').textContent = st.wrong;
  document.getElementById('pbar').style.width = (st.total? st.done/st.total*100 : 0)+'%';
  const parts=[];
  if(S.mod!=='all'){ const m=DATA.modules.find(x=>x.id===S.mod); parts.push(m.id+' '+m.name); } else parts.push('全部模块');
  if(S.type!=='all') parts.push(TNAME[S.type]);
  if(S.wrongOnly) parts.push('仅错题');
  if(S.shuffle) parts.push('随机顺序');
  document.getElementById('pScope').textContent =
    '当前范围：'+parts.join(' · ')+'　（'+view.length+' 题，已答 '+st.scopeDone+
    (st.scopeAcc===null? '' : '，范围正答率 '+st.scopeAcc.toFixed(1)+'%')+'）';
  document.getElementById('pNote').textContent =
    st.done? ('总体正答率 '+st.acc.toFixed(1)+'%') : '开始作答后自动保存进度';
}

function renderQuestion(){
  const body=document.getElementById('qbody');
  if(!view.length){
    body.innerHTML = '<div class="empty" style="padding:70px 20px">该筛选条件下暂无题目，请调整上方筛选。</div>';
    document.getElementById('navCount').textContent='';
    return;
  }
  const it = view[S.idx], q = it.q, r = rec(q.id);
  revealed = !!r || (q.type==='short' && shortRevealed);
  sel = r ? (q.type==='multiple'? r.ua.slice() : [].concat(r.ua)) : [];

  let h = '<div class="qwrap">';
  h += '<div class="qmeta"><span class="tag '+q.type+'">'+TNAME[q.type]+'</span>'+
       '<span class="qno">第 '+(S.idx+1)+' / '+view.length+' 题</span>'+
       '<span class="qsrc">'+esc(q.id)+'　'+esc(it.mid+' '+it.mname)+' · '+esc(it.kptitle)+'</span></div>';
  h += '<div class="stem">'+esc(q.stem)+'</div>';
  h += '<details class="kpnote"><summary>知识点速记 · '+esc(it.kptitle)+'</summary>'+
       '<p>'+esc(it.kpsummary)+'</p></details>';

  if(q.options){
    const tapHint = !revealed && (q.type==='single' || q.type==='judge');
    h += '<ul class="opts'+(tapHint?' tap':'')+'" id="opts">';
    q.options.forEach(o=>{
      const k = keyOf(o);
      let cls='opt';
      if(revealed){
        cls+=' lock';
        const correct = ansText(q).indexOf(k)>-1;
        const chosen = sel.indexOf(k)>-1;
        if(correct) cls+=' right';
        else if(chosen) cls+=' bad';
      }else if(sel.indexOf(k)>-1) cls+=' sel';
      const label = o.replace(/^[A-Za-z]\s*[.、．:：]?\s*/, '') || o;
      const isJudge = (q.type==='judge');
      if(isJudge) cls += ' plain';    // 判断题选项本身就是“对/错”，不再重复显示
      h += '<li class="'+cls+'" data-k="'+esc(k)+'">'+
           '<span class="k">'+esc(k)+'</span>'+
           (isJudge? '' : '<span>'+esc(label)+'</span>')+'</li>';
    });
    h += '</ul>';
  } else {
    h += '<div class="shortbox">简答题：请先自己组织答案，再点“查看参考答案”进行自评。</div>';
  }

  if(revealed){
    if(r){
      h += '<div class="fb '+(r.correct?'good':'bad')+'">'+
           '<div class="t">'+(r.correct?'✓ 回答正确':'✗ 回答错误')+'　正确答案：'+esc(ansText(q))+'</div>'+
           esc(q.explanation)+'</div>';
    }else{
      h += '<div class="fb"><div class="t n">参考答案：'+esc(ansText(q))+'</div>'+esc(q.explanation)+'</div>';
    }
    if(q.pitfall) h += '<div class="pit"><b>易错点：</b>'+esc(q.pitfall)+'</div>';
  }
  h += '</div>';

  /* 底部操作 */
  h += '<div class="qfoot">';
  h += '<button class="btn navbtn-m" id="btnNav" aria-label="打开题目导航">目录</button>';
  h += '<button class="btn" id="btnPrev"'+(S.idx===0?' disabled':'')+'>← 上一题</button>';
  if(!revealed){
    if(q.type==='multiple') h += '<button class="btn pri" id="btnSubmit">提交作答</button>';
    else if(q.type==='short') h += '<button class="btn pri" id="btnReveal">查看参考答案</button>';
    else h += '<span class="fnote">点击选项即判分</span>';
  }else{
    if(q.type==='short'){
      h += '<button class="btn" id="btnRedo">重新自评</button>';
    }else{
      h += '<button class="btn" id="btnRedo">重做本题</button>';
    }
  }
  h += '<button class="btn" id="btnNext"'+(S.idx>=view.length-1?' disabled':'')+'>下一题 →</button>';
  h += '<span class="fnote qid">'+esc(q.id)+'</span>';
  h += '</div>';

  body.innerHTML = h;
  bindQuestion();
  if(q.type==='short' && revealed && !r) renderShortJudge();
}

function bindQuestion(){
  const it=view[S.idx], q=it.q;
  const opts=document.getElementById('opts');
  if(opts && !revealed){
    opts.querySelectorAll('.opt').forEach(li=>li.onclick=()=>{
      const k=li.dataset.k;
      if(q.type==='multiple'){
        const i=sel.indexOf(k); i>-1? sel.splice(i,1) : sel.push(k);
        li.classList.toggle('sel');
      }else{ sel=[k]; commit(); }
    });
  }
  const b=(id,fn)=>{ const e=document.getElementById(id); if(e) e.onclick=fn; };
  b('btnSubmit', commit);
  b('btnReveal', ()=>commit());
  b('btnPrev', ()=>{ shortRevealed=false; S.idx--; save(); renderAll(); });
  b('btnNext', ()=>{ shortRevealed=false; S.idx++; save(); renderAll(); });
  b('btnRedo', ()=>{ delete S.answers[q.id]; save(); renderAll(); toast('已清除本题记录'); });
  b('btnNav', openSheet);
}

/* 提交判分 */
function commit(){
  const q = view[S.idx].q;

  if(q.type==='short'){          // 简答题：先揭晓参考答案，再由用户自评
    shortRevealed = true;
    renderAll();
    return;
  }

  if(q.type==='multiple'){
    if(!sel.length){ toast('请至少选择一个选项'); return; }
    const a = sel.slice().sort().join(''), b = q.answer.slice().sort().join('');
    setRec(q.id, a===b, sel.slice());
  }else{
    if(!sel.length){ toast('请先选择一个选项'); return; }
    setRec(q.id, sel[0]===String(q.answer), sel[0]);
  }
  renderAll();
}

function setRec(id, correct, ua){
  const prev = S.answers[id];
  S.answers[id] = {correct, ua, t:Date.now(), n: prev? (prev.n||1) : 1};
  save();
}

function renderShortJudge(){
  const foot=document.querySelector('.qfoot');
  if(!foot) return;
  const q=view[S.idx].q;
  foot.innerHTML =
    '<button class="btn navbtn-m" id="btnNav" aria-label="打开题目导航">目录</button>'+
    '<button class="btn" id="btnPrev"'+(S.idx===0?' disabled':'')+'>← 上一题</button>'+
    '<span class="fnote">请对照参考答案自评：</span>'+
    '<button class="btn ok" id="jOk">我答对了</button>'+
    '<button class="btn bad" id="jBad">我答错了</button>'+
    '<button class="btn" id="btnNext"'+(S.idx>=view.length-1?' disabled':'')+'>下一题 →</button>';
  const go = (dir)=>{ shortRevealed=false; S.idx=Math.min(Math.max(S.idx+dir,0),view.length-1); save(); renderAll(); };
  document.getElementById('jOk').onclick  = ()=>{ setRec(q.id, true,  '(自评：答对)'); go(1); };
  document.getElementById('jBad').onclick = ()=>{ setRec(q.id, false, '(自评：答错)'); go(1); };
  document.getElementById('btnPrev').onclick = ()=>go(-1);
  document.getElementById('btnNext').onclick = ()=>go(1);
  document.getElementById('btnNav').onclick = openSheet;
}

/* ---------- 侧栏 ---------- */
function renderSheet(){
  const box=document.getElementById('sheet');
  document.getElementById('navCount').textContent = view.length? (S.idx+1)+'/'+view.length : '';
  if(!view.length){ box.innerHTML='<div class="empty">暂无题目</div>'; return; }

  if(navMode==='grid'){
    let h='<div class="grid">';
    view.forEach((it,i)=>{
      const r=rec(it.q.id);
      h+='<div class="gcell'+(r?(r.correct?' ok':' miss'):'')+(i===S.idx?' cur':'')+'" data-i="'+i+'" title="'+esc(it.q.id)+'"></div>';
    });
    h+='</div><div class="tip">灰色=未作答　绿色=答对　红色=答错　点击色块跳转</div>';
    box.innerHTML=h;
    box.querySelectorAll('.gcell').forEach(c=>c.onclick=()=>{ S.idx=+c.dataset.i; save(); renderAll(); closeSheet(); });
    return;
  }

  const list = navMode==='wrong'
    ? view.map((it,i)=>({it,i})).filter(o=>isWrong(o.it.q.id))
    : view.map((it,i)=>({it,i}));

  if(!list.length){
    box.innerHTML='<div class="empty">'+(navMode==='wrong'?'还没有错题，继续保持 👍':'暂无题目')+'</div>';
    return;
  }
  let h='';
  list.forEach(({it,i})=>{
    const r=rec(it.q.id);
    const cls = r? (r.correct?'done':'miss') : '';
    h+='<div class="srow '+cls+'" data-i="'+i+'">'+
       '<div class="h"><span class="tag '+it.q.type+'">'+TNAME[it.q.type]+'</span>'+
       '<span>'+esc(it.q.id)+'</span>'+
       '<span style="margin-left:auto;color:'+(r?(r.correct?'var(--ok)':'var(--brand)'):'#9aa1ab')+'">'+
       (r?(r.correct?'✓ 已答对':'✗ 已答错'):'未作答')+'</span></div>'+
       '<div class="x">'+esc(it.kptitle)+'：'+esc(it.q.stem.slice(0,52))+'</div></div>';
  });
  box.innerHTML=h;
  box.querySelectorAll('.srow').forEach(el=>el.onclick=()=>{ S.idx=+el.dataset.i; save(); renderAll(); closeSheet(); });
}

/* 筛选变化后：重建视图再渲染 */
function applyFilter(){ buildView(); renderAll(); }

/* ---------- 主渲染 ---------- */
function renderAll(){
  renderHeader(); renderQuestion(); renderSheet(); scrollSheetToCurrent();
}

/* 让导航里的当前题滚入可视区：只滚动导航面板自身，绝不滚动整个页面
   （手机端导航面板是 fixed 抽屉，用 scrollIntoView 会把整页顶走） */
function scrollSheetToCurrent(){
  const sheet=document.getElementById('sheet');
  const row=sheet.querySelector('.srow[data-i="'+S.idx+'"]') || sheet.querySelector('.gcell[data-i="'+S.idx+'"]');
  if(!row) return;
  const a=row.getBoundingClientRect(), b=sheet.getBoundingClientRect();
  if(a.top>=b.top-1 && a.bottom<=b.bottom+1) return;   // 已在可视区
  sheet.scrollTop += (a.top-b.top) - (sheet.clientHeight-a.height)/2;
}

/* ---------- 筛选交互 ---------- */
function initFilters(){
  const sel=document.getElementById('fMod');
  let h='<option value="all">全部模块（'+ALL.length+' 题）</option>';
  DATA.modules.forEach(m=>{
    const n=m.knowledgePoints.reduce((s,k)=>s+k.questions.length,0);
    h+='<option value="'+m.id+'">'+m.id+' '+esc(m.name)+'（'+n+' 题）</option>';
  });
  sel.innerHTML=h;
  sel.value=S.mod;
  sel.onchange=()=>{ S.mod=sel.value; S.idx=0; save(); applyFilter(); };

  document.querySelectorAll('.chip[data-t]').forEach(c=>{
    if(S.type===c.dataset.t) c.classList.add('on'); else c.classList.remove('on');
    c.onclick=()=>{
      document.querySelectorAll('.chip[data-t]').forEach(x=>x.classList.remove('on'));
      c.classList.add('on'); S.type=c.dataset.t; S.idx=0; save(); applyFilter();
    };
  });

  const fw=document.getElementById('fWrong');
  fw.classList.toggle('on', S.wrongOnly);
  fw.onclick=()=>{ S.wrongOnly=!S.wrongOnly; fw.classList.toggle('on',S.wrongOnly); S.idx=0; save(); applyFilter(); };

  const fs=document.getElementById('fShuffle');
  fs.classList.toggle('on', S.shuffle);
  fs.onclick=()=>{
    S.shuffle=!S.shuffle; fs.classList.toggle('on',S.shuffle);
    if(S.shuffle){
      const a=ALL.map(x=>x.q.id);
      for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
      S.order=a;
    } else S.order=null;
    S.idx=0; save(); applyFilter(); toast(S.shuffle?'已开启随机顺序':'已恢复顺序出题');
  };

  document.getElementById('fReset').onclick=()=>{
    if(!confirm('确定要清空全部作答记录与进度吗？此操作不可撤销。')) return;
    S.answers={}; S.idx=0; save(); applyFilter(); toast('进度已重置');
  };

  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); navMode=b.dataset.v; renderSheet();
  });
}

/* ---------- 键盘 ---------- */
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(e.target.tagName==='BUTTON') return;   // 按钮获得焦点时交给按钮自身处理，避免重复触发
  const q = view[S.idx] && view[S.idx].q;
  if(!q) return;
  const nav = d=>{ shortRevealed=false; S.idx=Math.min(Math.max(S.idx+d,0),view.length-1); save(); renderAll(); };
  if(e.key==='ArrowLeft'){ nav(-1); e.preventDefault(); }
  else if(e.key==='ArrowRight'){ nav(1); e.preventDefault(); }
  else if(e.key==='Enter'){
    if(revealed && !(q.type==='short' && !rec(q.id))) nav(1);
    else if(q.type==='multiple') commit();
    else if(q.type==='short') commit();
    e.preventDefault();
  }
  else if(/^[1-9]$/.test(e.key) && q.options && !revealed){
    const opts=document.querySelectorAll('#opts .opt');
    const el=opts[+e.key-1]; if(el) el.click();
  }
});

/* ---------- 手机端：底部抽屉式题目导航 ---------- */
const asideEl = document.querySelector('.aside');
const scrimEl = document.getElementById('scrim');
const isMobile = ()=>window.matchMedia('(max-width:900px)').matches;
function openSheet(){
  if(!isMobile()) return;
  document.body.classList.add('sheet-open');
  asideEl.classList.add('open'); scrimEl.classList.add('on');
}
function closeSheet(){
  document.body.classList.remove('sheet-open');
  asideEl.classList.remove('open'); scrimEl.classList.remove('on');
}
scrimEl.onclick = closeSheet;
const navCloseEl = document.getElementById("navClose");
if(navCloseEl) navCloseEl.onclick = (e)=>{ e.stopPropagation(); closeSheet(); };
window.addEventListener('resize', ()=>{ if(!isMobile()) closeSheet(); });
window.addEventListener('orientationchange', ()=>{ if(!isMobile()) closeSheet(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSheet(); });

/* ---------- 启动 ---------- */
document.getElementById('srcLine').textContent = DATA.stats.modules+' 模块 / '+
  DATA.stats.knowledgePoints+' 知识点 / '+DATA.stats.questions+' 题';
initFilters(); buildView(); renderAll();
</script>
</body>
</html>
