<title>鼎和保险 · 保险学刷题器</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --line:#e4e6ea; --line2:#eef0f3;
  --text:#1f2328; --muted:#6b7280; --brand:#c0392b; --brand-soft:#fdecea;
  --blue:#2563eb; --blue-soft:#eef3fe; --ok:#16a34a; --ok-soft:#e9f7ef;
  --warn:#d97706; --warn-soft:#fdf4e3;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-size:15px;line-height:1.65;
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit}

/* ---------- header ---------- */
header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.hbar{max-width:1080px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-size:16px;font-weight:700;letter-spacing:.2px}
.brand small{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
.hspace{flex:1}
.kpis{display:flex;gap:8px;flex-wrap:wrap}
.kpi{background:#fafbfc;border:1px solid var(--line);border-radius:9px;padding:5px 11px;font-size:12px;color:var(--muted);line-height:1.35;text-align:center;min-width:78px}
.kpi b{display:block;font-size:16px;color:var(--text);font-weight:700;letter-spacing:.3px}
.kpi.ok b{color:var(--ok)} .kpi.bad b{color:var(--brand)} .kpi.blue b{color:var(--blue)}
.pbar{height:6px;background:#eceef1;border-radius:99px;overflow:hidden;max-width:1080px;margin:0 auto}
.pbar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3b82f6,#16a34a);transition:width .35s ease}
.pwrap{max-width:1080px;margin:0 auto;padding:0 18px 8px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

/* ---------- layout ---------- */
.wrap{max-width:1080px;margin:14px auto 0;padding:0 18px 40px;display:grid;grid-template-columns:1fr 290px;gap:16px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.wrap>*{min-width:0}

/* ---------- filters ---------- */
.filters{padding:12px 16px;border-bottom:1px solid var(--line2);background:#fcfcfd;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font-size:13px;color:var(--text);max-width:240px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 12px;font-size:12.5px;color:var(--muted);cursor:pointer;transition:.15s}
.chip:hover{border-color:#c9ccd1;color:var(--text)}
.chip.on{background:var(--text);border-color:var(--text);color:#fff}
.chip.warn.on{background:var(--brand);border-color:var(--brand)}

/* ---------- question ---------- */
.qwrap{padding:20px 22px 6px}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:11px;padding:1.5px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted);background:#fbfbfc}
.tag.single{color:#1d4ed8;border-color:#cddaf7;background:var(--blue-soft)}
.tag.multiple{color:#7c3aed;border-color:#ddd0fb;background:#f4efff}
.tag.judge{color:#0f766e;border-color:#c3e6e1;background:#eafaf7}
.tag.short{color:#b45309;border-color:#f2ddba;background:#fdf6e9}
.qno{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.qsrc{margin-left:auto;font-size:11.5px;color:#9aa1ab}
.stem{font-size:17px;font-weight:600;line-height:1.6;margin:2px 0 12px}
.kpnote{border:1px dashed var(--line);background:#fcfcfd;border-radius:9px;padding:7px 12px;margin:0 0 14px;font-size:12.5px}
.kpnote summary{cursor:pointer;color:var(--muted);outline:none}
.kpnote summary::marker{color:#b9c0c9}
.kpnote p{margin:7px 0 2px;color:#4b5563;line-height:1.7}
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.opt{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;cursor:pointer;display:flex;gap:11px;align-items:flex-start;transition:.15s;font-size:14.5px}
.opt:hover{border-color:#b9c0c9;background:#fbfcfd}
.opt .k{flex:0 0 24px;height:24px;border-radius:7px;background:#f1f3f5;color:var(--muted);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.sel .k{background:var(--blue);color:#fff}
.opt.right{border-color:#8fd6ab;background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.bad{border-color:#f0b3ac;background:var(--brand-soft)}
.opt.bad .k{background:var(--brand);color:#fff}
.opt.lock{cursor:default}
.opt.lock:hover{background:inherit;border-color:inherit}
.opt.lock:hover.sel{background:var(--blue-soft);border-color:var(--blue)}
.opt.lock:hover.right{background:var(--ok-soft);border-color:#8fd6ab}
.opt.lock:hover.bad{background:var(--brand-soft);border-color:#f0b3ac}
.opt.plain .k{flex:0 0 auto;min-width:36px;height:26px;font-size:13px;padding:0 10px;border-radius:8px}

.shortbox{border:1px dashed var(--line);border-radius:10px;background:#fcfcfd;padding:12px 14px;font-size:14px;color:var(--muted)}

.fb{margin-top:14px;border-radius:10px;padding:11px 14px;font-size:13.5px;border-left:3px solid var(--blue);background:#f7faff}
.fb.good{border-color:var(--ok);background:var(--ok-soft)}
.fb.bad{border-color:var(--brand);background:var(--brand-soft)}
.fb .t{font-weight:700;margin-bottom:3px}
.fb.good .t{color:#15803d} .fb.bad .t{color:var(--brand)} .fb .t.n{color:var(--blue)}
.pit{margin-top:9px;border-radius:9px;padding:9px 13px;font-size:13px;border-left:3px solid var(--warn);background:var(--warn-soft);color:#8a5a12}
.pit b{color:#a16207}
.qfoot{display:flex;gap:10px;align-items:center;padding:14px 22px 18px;border-top:1px solid var(--line2);margin-top:14px;background:#fcfcfd}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 16px;font-size:13.5px;cursor:pointer;color:var(--text);transition:.15s}
.btn:hover{border-color:#b9c0c9;background:#fafbfc}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:#1d4ed8;border-color:#1d4ed8}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--brand);border-color:var(--brand);color:#fff}
.fnote{margin-left:auto;font-size:12px;color:var(--muted)}

/* ---------- aside ---------- */
.aside{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;position:sticky;top:96px}
.aside h3{margin:0 0 10px;font-size:13px;letter-spacing:.4px;color:var(--muted);font-weight:700;display:flex;align-items:center}
.aside h3 span{margin-left:auto;font-weight:400}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 0;font-size:12.5px;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--text);border-color:var(--text);color:#fff}
.sheet{max-height:min(58vh,520px);overflow:auto;margin:-2px -4px 0;padding:0 4px}
.sheet::-webkit-scrollbar{width:7px}.sheet::-webkit-scrollbar-thumb{background:#d9dde3;border-radius:9px}
.srow{border:1px solid var(--line2);border-radius:9px;padding:8px 10px;margin-bottom:7px;cursor:pointer;font-size:12.5px;line-height:1.5;transition:.15s}
.srow:hover{border-color:#b9c0c9;background:#fbfcfd}
.srow .h{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:11px;margin-bottom:3px}
.srow .x{color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.srow.miss{border-left:3px solid var(--brand)}
.srow.done{border-left:3px solid var(--ok)}
.empty{color:var(--muted);font-size:12.5px;text-align:center;padding:26px 8px}
.jump{display:grid;grid-template-columns:1fr 74px;gap:6px;margin-top:10px}
.jump input{border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:13px;width:100%}
.grid{display:flex;flex-wrap:wrap;gap:4px}
.gcell{width:15px;height:15px;border-radius:4px;background:#eceef1;cursor:pointer;border:1px solid transparent}
.gcell:hover{border-color:#9aa1ab}
.gcell.ok{background:#9ddcb6}.gcell.miss{background:#f0a9a1}.gcell.cur{outline:2px solid var(--blue);outline-offset:1px}
.tip{font-size:11.5px;color:#9aa1ab;margin-top:10px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);background:#1f2328;color:#fff;border-radius:10px;padding:9px 18px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:60}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
kbd{background:#f1f3f5;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:11.5px;font-family:inherit}
/* ---------- 手机端（≤900px）：题目导航收进底部抽屉，不再占位、不遮挡题目 ---------- */
.scrim{display:none}
.navbtn-m{display:none}
.navclose{display:none;margin-left:8px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 10px;font-size:11.5px;line-height:1.55;color:var(--muted);cursor:pointer;flex:0 0 auto;font-family:inherit}
.navclose:hover{color:var(--text);border-color:#b9c0c9}
body.sheet-open{overflow:hidden}
@media(max-width:900px){
  .hbar{padding:8px 12px;gap:7px}
  .brand{font-size:15px}
  .brand small{display:none}
  .hspace{display:none}
  .kpis{width:100%;gap:6px}
  .kpi{flex:1 1 0;min-width:0;padding:4px 4px;font-size:11px;border-radius:8px}
  .kpi b{font-size:15px}
  .pwrap{padding:0 12px 6px;font-size:11.5px;gap:4px;flex-wrap:wrap}

  /* 主区占满，题目直接置顶 */
  .wrap{margin:8px auto 0;grid-template-columns:1fr;padding:0 10px calc(16px + env(safe-area-inset-bottom));gap:10px}
  .card{overflow:visible}
  /* 筛选栏压成一行，可横向滑动，避免把题目挤到屏幕中部 */
  .filters{padding:8px 12px;gap:6px;border-radius:14px 14px 0 0;
    flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .filters select{flex:0 0 auto;width:auto;min-width:116px;max-width:172px;order:0;font-size:12.5px;padding:5px 8px}
  .filters .chip{flex:0 0 auto;padding:5px 11px;font-size:12px;white-space:nowrap}
  .filters #fReset{margin-left:0 !important}
  .qwrap{padding:12px 14px 4px}
  .qmeta{margin-bottom:6px}
  .stem{font-size:16px}
  .stem,.kpnote p{word-break:break-word}
  .kpnote{font-size:12px}
  .opt{font-size:14px;padding:10px 12px;gap:9px}
  .qsrc{width:100%;margin-left:0}
  .qfoot{flex-wrap:wrap;gap:8px;padding:11px 14px calc(11px + env(safe-area-inset-bottom));
    position:sticky;bottom:0;z-index:20;background:#fff;border-radius:0 0 14px 14px;
    box-shadow:0 -6px 18px rgba(15,23,42,.08)}
  /* 提示文字移出吸底条，并收紧按钮，尽量保持单行 */
  .qfoot .btn{padding:7px 11px;font-size:12.5px}
  .qfoot .fnote{display:none}
  .opts.tap::after{content:"点击选项即判分";align-self:flex-start;margin-top:1px;
    font-size:11.5px;color:#9aa1ab}

  /* 底部抽屉式题目导航 */
  .aside{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:50;
    max-height:76vh;display:flex;flex-direction:column;border-bottom:none;
    border-radius:16px 16px 0 0;padding:8px 14px calc(12px + env(safe-area-inset-bottom));
    transform:translateY(104%);transition:transform .28s cubic-bezier(.32,.72,0,1);
    box-shadow:0 -10px 34px rgba(15,23,42,.18);will-change:transform}
  .aside::before{content:"";display:block;flex:0 0 auto;width:38px;height:4px;border-radius:99px;
    background:#d7dbe1;margin:2px auto 8px}
  .aside.open{transform:translateY(0)}
  .aside h3,.aside .tabs{flex:0 0 auto}
  .aside .tip{display:none}
  .sheet{flex:1 1 auto;max-height:none;min-height:110px;overflow:auto;-webkit-overflow-scrolling:touch}

  .scrim{display:block;position:fixed;inset:0;z-index:40;background:rgba(15,23,42,.45);
    opacity:0;pointer-events:none;transition:opacity .25s}
  .scrim.on{opacity:1;pointer-events:auto}

  /* “目录”并入吸底操作条，避免与浮动按钮互相遮挡 */
  .navclose{display:inline-block}
  .navbtn-m{display:inline-block;font-weight:600}
  .qfoot .navbtn-m{order:-1}
}
@media(max-width:380px){.kpi{font-size:10px}.brand{font-size:14px}}

@media(max-width:380px){.kpi{font-size:10px}.brand{font-size:14px}}

</style>

const DATA = {"title": "鼎和保险·保险学考试题库", "version": "1.0", "generatedAt": "2026-09-11", "sources": ["保险学复习资料.docx", "鼎和保险培训知识点汇总.pdf"], "description": "依据两份复习资料逐知识点整理，覆盖选择题（单选/多选）、判断题、简答题，并标注易错点与挖坑点。", "schema": {"module.id": "模块编号", "module.name": "模块名称", "module.source": "资料来源", "knowledgePoint.id": "知识点编号", "knowledgePoint.title": "知识点标题", "knowledgePoint.summary": "知识点速记", "question.id": "题目编号", "question.type": "single=单选 | multiple=多选 | judge=判断 | short=简答", "question.stem": "题干", "question.options": "选项（判断题固定为 对/错）", "question.answer": "答案：single为字母；multiple为字母数组；judge为“对/错”；short为参考答案", "question.explanation": "解析", "question.pitfall": "易错点/挖坑点（可缺省）"}, "stats": {"modules": 11, "knowledgePoints": 70, "questions": 361, "byType": {"single": 172, "multiple": 104, "judge": 70, "short": 15}}, "modules": [{"id": "M01", "name": "保险学基础·风险与保险总论", "source": "保险学复习资料.docx（第一~四节）", "knowledgePoints": [{"id": "M01-KP01", "title": "保险的定义", "summary": "保险：以集中起来的保险费建立保险基金，用于补偿因自然灾害或意外事故造成的经济损失；或针对个人死亡、伤残、医疗费用等进行给付的一种方法。", "questions": [{"id": "M01-Q01", "type": "single", "stem": "下列关于保险的表述，最准确的是（　）。", "options": ["A. 保险是一种高收益的储蓄方式", "B. 保险以集中起来的保险费建立保险基金，用于补偿损失或进行给付", "C. 保险是投保人单方获利的行为", "D. 保险只承保财产损失"], "answer": "B", "explanation": "保险是集合众多投保人的保险费建立保险基金，对约定的经济损失予以补偿，或对人身事件予以给付。", "pitfall": "D 项是最常见坑：保险不只补偿财产损失，还包括人身保险的保险金给付（给付≠补偿）。"}, {"id": "M01-Q02", "type": "judge", "stem": "保险的核心机制是投保人支付保险费，将约定风险转移给保险人，保险人集中大量同质风险并按合同承担赔偿或给付责任。", "options": ["对", "错"], "answer": "对", "explanation": "这正是保险的核心机制：风险转移 + 风险汇聚。"}, {"id": "M01-Q03", "type": "single", "stem": "从被保险人的角度看，保险是（　）；从保险人的角度看，保险是（　）。", "options": ["A. 管理风险的手段；转移风险的方法", "B. 转移风险的方法；管理和消化风险的手段", "C. 储蓄方式；投资方式", "D. 获利行为；慈善行为"], "answer": "B", "explanation": "被保险人角度是转移风险，保险人角度是管理和消化风险。", "pitfall": "两个视角极易互换，注意题干问的是“从谁的角度”。"}, {"id": "M01-Q04", "type": "short", "stem": "简述保险的定义。", "answer": "保险是以集中起来的保险费建立保险基金，用于补偿因自然灾害或意外事故造成的经济损失；或针对个人死亡、伤残、医疗费用等进行给付的一种方法。", "explanation": "答题要点：①集中保费建立保险基金；②补偿经济损失；③人身事件给付。"}, {"id": "M01-Q05", "type": "multiple", "stem": "保险的“两器”作用是指（　）。", "options": ["A. 经济减震器", "B. 社会稳定器", "C. 利润放大器", "D. 风险制造器"], "answer": ["A", "B"], "explanation": "保险发挥“经济减震器”和“社会稳定器”作用。", "pitfall": "“经济减震器”在公司资料中又被表述为横向分散损失、纵向平滑年度冲击。"}]}, {"id": "M01-KP02", "title": "风险的定义与基本特征", "summary": "风险：在一定客观情况下和一定时期内，某种随机事件发生给人们经济利益造成损失的不确定性。基本特征：客观性、不确定性。保险研究的对象是风险。", "questions": [{"id": "M01-Q06", "type": "single", "stem": "风险的实质是（　）。", "options": ["A. 损失必然发生", "B. 损失发生的不确定性", "C. 损失金额已知", "D. 收益的不确定性"], "answer": "B", "explanation": "风险强调“损失的不确定性”，包含是否发生、何时发生、损失多大等不确定。", "pitfall": "风险≠损失本身，风险是“不确定性”。"}, {"id": "M01-Q07", "type": "multiple", "stem": "风险的基本特征包括（　）。", "options": ["A. 客观性", "B. 不确定性", "C. 盈利性", "D. 必然性"], "answer": ["A", "B"], "explanation": "风险具有客观性和不确定性。", "pitfall": "“必然性”是干扰项——若损失必然发生且确定，就不再是风险。"}, {"id": "M01-Q08", "type": "judge", "stem": "保险研究的对象是风险。", "options": ["对", "错"], "answer": "对", "explanation": "保险以风险为研究对象。"}]}, {"id": "M01-KP03", "title": "风险的分类", "summary": "按损失结果：纯粹风险（只有损失或无损失）、投机风险（损失、无损失、盈利）。按损失暴露对象：人身风险、财产风险、责任风险。保险通常承保纯粹风险。", "questions": [{"id": "M01-Q09", "type": "single", "stem": "下列属于投机风险的是（　）。", "options": ["A. 火灾", "B. 股票投资", "C. 车辆碰撞", "D. 医疗费用"], "answer": "B", "explanation": "股票投资存在损失、无损失、盈利三种结果，属于投机风险；其余三项只有损失或无损失，属纯粹风险。"}, {"id": "M01-Q10", "type": "judge", "stem": "保险通常承保投机风险。", "options": ["对", "错"], "answer": "错", "explanation": "保险通常承保纯粹风险，不承保投机风险。", "pitfall": "把“纯粹”和“投机”写反是高频陷阱。"}, {"id": "M01-Q11", "type": "single", "stem": "纯粹风险可能产生的结果有（　）。", "options": ["A. 只有损失", "B. 损失或无损失", "C. 损失、无损失或盈利", "D. 只有盈利"], "answer": "B", "explanation": "纯粹风险只有损失或无损失两种结果，不含获利可能。", "pitfall": "只有盈利或不损失才获利的是投机风险。"}, {"id": "M01-Q12", "type": "multiple", "stem": "按损失暴露对象划分，风险可分为（　）。", "options": ["A. 人身风险", "B. 财产风险", "C. 责任风险", "D. 投机风险"], "answer": ["A", "B", "C"], "explanation": "按损失暴露对象分为人身风险、财产风险、责任风险。投机风险是按损失结果的分类，不是按暴露对象。", "pitfall": "两套分类维度混在一个选项里，注意维度一致性。"}]}, {"id": "M01-KP04", "title": "风险处理方法", "summary": "风险避免、风险预防与控制、风险自留、风险转移、综合运用。一般而言，低频高损风险最适合通过保险转移。", "questions": [{"id": "M01-Q13", "type": "multiple", "stem": "风险处理的方法包括（　）。", "options": ["A. 风险避免", "B. 风险预防与控制", "C. 风险自留", "D. 风险转移与综合运用"], "answer": ["A", "B", "C", "D"], "explanation": "四类基本方法：避免、预防与控制、自留、转移（含综合运用）。"}, {"id": "M01-Q14", "type": "single", "stem": "一般而言，最适合通过保险进行转移的风险是（　）。", "options": ["A. 高频高损风险", "B. 低频高损风险", "C. 高频低损风险", "D. 低频低损风险"], "answer": "B", "explanation": "低频高损风险发生概率低但损失巨大，最适合用保险转移；高频低损更适合自留并辅以预防。", "pitfall": "“低频高损”与“高频低损”是最容易互换的挖坑点。"}, {"id": "M01-Q15", "type": "judge", "stem": "风险自留是风险处理方法之一，且自留不需要付出任何代价。", "options": ["对", "错"], "answer": "错", "explanation": "风险自留是处理方法之一，但自留意味着自行承担损失后果，并非“无代价”。", "pitfall": "前半句对、后半句错，属于半对半错的命题陷阱。"}]}, {"id": "M01-KP05", "title": "可保风险的六项条件", "summary": "随机性、明确性、重大性、可预测性、非巨灾性、同质性。其中随机性是对个体而言，明确性/可预测性/同质性主要对整体而言，偶然性与必然性通过大数法则关联。", "questions": [{"id": "M01-Q16", "type": "single", "stem": "可保风险的条件不包括（　）。", "options": ["A. 随机性", "B. 同质性", "C. 投机性", "D. 可预测性"], "answer": "C", "explanation": "可保风险要求的是纯粹风险，投机性不属于可保风险条件。"}, {"id": "M01-Q17", "type": "multiple", "stem": "可保风险的六项条件包括（　）。", "options": ["A. 随机性、明确性", "B. 重大性、可预测性", "C. 非巨灾性、同质性", "D. 必然性、投机性"], "answer": ["A", "B", "C"], "explanation": "六项条件为随机、明确、重大、可预测、非巨灾、同质。", "pitfall": "“必然性”“投机性”是典型干扰项。"}, {"id": "M01-Q18", "type": "single", "stem": "可保风险条件中，“损失发生的时间、地点、原因、金额可以明确”对应的是（　）。", "options": ["A. 随机性", "B. 明确性", "C. 重大性", "D. 同质性"], "answer": "B", "explanation": "明确性指损失的时间、地点、规模等可以明确。"}, {"id": "M01-Q19", "type": "single", "stem": "“可以利用大数法则估计损失概率”体现的可保风险条件是（　）。", "options": ["A. 明确性", "B. 重大性", "C. 可预测性", "D. 非巨灾性"], "answer": "C", "explanation": "可预测性指整体损失概率可以预测，依靠大数法则。"}, {"id": "M01-Q20", "type": "judge", "stem": "可保风险的“随机性”是对整体而言的，而“可预测性”是对个体而言的。", "options": ["对", "错"], "answer": "错", "explanation": "恰好相反：随机性针对个体（个体事故是否发生、何时发生不确定）；可预测性、明确性、同质性主要针对整体。", "pitfall": "个体/整体归属颠倒，是本节最高频的坑。"}, {"id": "M01-Q21", "type": "judge", "stem": "“非巨灾性”是指对保险人而言，损失不能形成无法承受的高度集中风险。", "options": ["对", "错"], "answer": "对", "explanation": "非巨灾性是从保险人承受能力角度提出的条件。"}, {"id": "M01-Q22", "type": "short", "stem": "为什么可保风险要求“大量同质风险单位”？", "answer": "只有存在大量相似（同质）的风险单位，才能利用大数法则较为准确地预测整体损失概率，从而合理厘定费率、分散风险、稳定经营。", "explanation": "答题要点：同质风险单位 + 大数法则 + 预测损失概率 + 分散风险。"}]}, {"id": "M01-KP06", "title": "保险分类：按保险标的/风险对象划分", "summary": "人身保险（以人的寿命和身体为标的）：人寿保险（死亡、生存、两全、年金）、健康保险、意外伤害保险；财产保险（以财产及其有关利益为标的）：财产损失保险、责任保险、信用保险与保证保险。", "questions": [{"id": "M01-Q23", "type": "single", "stem": "意外伤害保险属于（　）。", "options": ["A. 财产保险", "B. 人身保险", "C. 责任保险", "D. 保证保险"], "answer": "B", "explanation": "意外伤害保险以人的身体为保险标的，属于人身保险。", "pitfall": "“财险公司可以经营短期意外险”是经营资格问题，不改变其人身保险的性质。"}, {"id": "M01-Q24", "type": "multiple", "stem": "中国保险法语境下，人身保险包括（　）。", "options": ["A. 人寿保险", "B. 健康保险", "C. 意外伤害保险", "D. 责任保险"], "answer": ["A", "B", "C"], "explanation": "人身保险包括人寿保险、健康保险、意外伤害保险；责任保险属于财产保险。"}, {"id": "M01-Q25", "type": "multiple", "stem": "人寿保险包括（　）。", "options": ["A. 死亡保险", "B. 生存保险", "C. 两全保险", "D. 年金保险"], "answer": ["A", "B", "C", "D"], "explanation": "人寿保险包括死亡保险、生存保险、两全保险和年金保险。"}, {"id": "M01-Q26", "type": "judge", "stem": "意外伤害保险属于人身保险，因此财产保险公司不得经营。", "options": ["对", "错"], "answer": "错", "explanation": "意外伤害保险确实属于人身保险，但财产保险公司依规可以经营短期健康保险和意外伤害保险。", "pitfall": "“性质归属”与“经营范围”是两个问题，最易出错。"}, {"id": "M01-Q27", "type": "judge", "stem": "保证保险、责任保险都属于财产保险。", "options": ["对", "错"], "answer": "对", "explanation": "二者均以财产及其有关利益为标的，属财产保险。"}, {"id": "M01-Q28", "type": "single", "stem": "财产保险的保险标的是（　）。", "options": ["A. 人的寿命和身体", "B. 财产及其有关利益", "C. 投保人的信用", "D. 受益人的权益"], "answer": "B", "explanation": "财产保险以财产及其有关利益为保险标的。"}]}, {"id": "M01-KP07", "title": "保险分类：按损失暴露对象划分", "summary": "直接风险（标的本身毁损）、间接风险（营业中断、利润损失、租金损失）、额外费用（为减少损失或继续经营产生的额外支出）、责任风险（对第三者人身/财产造成损害）。", "questions": [{"id": "M01-Q29", "type": "judge", "stem": "退货运费险、航班延误险通常属于财产保险中的费用损失/运输延误类保险。", "options": ["对", "错"], "answer": "对", "explanation": "二者不属于人身保险，通常归入财产保险中的费用损失/运输延误类。", "pitfall": "误以为是“人身相关”就归人身保险，是常见误判。"}, {"id": "M01-Q30", "type": "single", "stem": "企业因火灾停工造成的营业中断、利润损失，属于（　）。", "options": ["A. 直接风险", "B. 间接风险", "C. 责任风险", "D. 额外费用"], "answer": "B", "explanation": "营业中断、利润损失、租金损失属于间接风险。"}, {"id": "M01-Q31", "type": "multiple", "stem": "按损失暴露对象，风险可表现为（　）。", "options": ["A. 直接风险", "B. 间接风险", "C. 额外费用", "D. 责任风险"], "answer": ["A", "B", "C", "D"], "explanation": "直接风险、间接风险、额外费用、责任风险构成按暴露对象的划分。"}]}, {"id": "M01-KP08", "title": "保险与赌博、储蓄、救济的比较及历史", "summary": "共同点：保险与赌博都有偶然性、以小博大。历史：海商法共同海损分摊是海上保险萌芽；1667年巴蓬火险保单；1693年哈雷编制生命表。", "questions": [{"id": "M01-Q32", "type": "single", "stem": "保险与赌博的共同点是（　）。", "options": ["A. 都以互助为目的", "B. 都具有偶然性、以小博大", "C. 都创造风险", "D. 都可获得超额收益"], "answer": "B", "explanation": "二者共同点在于结果的偶然性和“以小博大”的形式。", "pitfall": "“创造风险”是赌博的特征，不是共同点。"}, {"id": "M01-Q33", "type": "short", "stem": "简述保险与赌博的主要区别。", "answer": "保险转移的是既有的、客观存在的风险，投保人缴纳保费是为了在损失后恢复原有经济价值，属于互助行为；赌博则创造了原本不存在的风险，参与者追求的是超额收益，属于损人利己或损己利人的行为。", "explanation": "答题要点：既有风险 vs 创造风险；恢复原状 vs 追求超额收益；互助 vs 非互助。"}, {"id": "M01-Q34", "type": "short", "stem": "简述保险与储蓄的区别。", "answer": "储蓄是个人行为，流动性较高，本金和利息确定，属于积极行为；保险是群体行为，合同生效后一般不能随意退保，保费由概率分布确定，体现“我为人人、人人为我”的互助性。", "explanation": "答题要点：个人 vs 群体；能否随意退保；确定性 vs 概率性；互助性。"}, {"id": "M01-Q35", "type": "single", "stem": "海上保险的萌芽通常认为来自（　）。", "options": ["A. 火灾保险", "B. 海商法中的共同海损分摊", "C. 生命表的编制", "D. 责任保险的出现"], "answer": "B", "explanation": "海商法中的共同海损分摊制度被视为海上保险的萌芽。"}, {"id": "M01-Q36", "type": "single", "stem": "1693年（　）编制了生命表，为人寿保险奠定了数理基础。", "options": ["A. 巴蓬", "B. 哈雷", "C. 劳埃德", "D. 贝努利"], "answer": "B", "explanation": "1693年哈雷编制生命表。", "pitfall": "不要与1667年巴蓬的火险保单记混。"}, {"id": "M01-Q37", "type": "judge", "stem": "1667年巴蓬开办的火险业务是近代火灾保险的重要标志。", "options": ["对", "错"], "answer": "对", "explanation": "1667年巴蓬火险保单（火险业务）是近代火灾保险的重要标志。"}]}]}, {"id": "M02", "name": "保险学基础·原则体系与保险合同", "source": "保险学复习资料.docx（第五~九节）", "knowledgePoints": [{"id": "M02-KP01", "title": "保险原则体系与保险合同特点", "summary": "原则体系：核心原则（大数法则与概率论、风险汇聚与分散、射幸合同原则）、法理原则（保险利益、最大诚信、损失补偿、近因，衍生代位求偿）、经营与精算原则、风险管理原则。合同特点：双务有偿性、附和性、最大诚信、射幸性（另有要式性）。", "questions": [{"id": "M02-Q01", "type": "single", "stem": "保险合同与普通商业合同相比，最被强调的是（　）。", "options": ["A. 双务有偿", "B. 最大诚信与射幸性", "C. 附和性", "D. 有偿性"], "answer": "B", "explanation": "保险合同最突出的特点是“最大诚信”与“射幸性”，这也是它与普通商业合同的核心差别。", "pitfall": "双务有偿、有偿性是一般合同共性，不是“最强调”的差异。"}, {"id": "M02-Q02", "type": "multiple", "stem": "保险合同的特点包括（　）。", "options": ["A. 射幸性", "B. 附和性", "C. 双务有偿性", "D. 最大诚信性（含要式性）"], "answer": ["A", "B", "C", "D"], "explanation": "五项典型特点：射幸性、附和性、双务性、要式性、最大诚信性。"}, {"id": "M02-Q03", "type": "judge", "stem": "附和性意味着投保人对保险条款完全没有协商的可能。", "options": ["对", "错"], "answer": "错", "explanation": "附和性指条款多由保险人预先拟定，投保人通常只能接受或拒绝，但并非绝对无协商空间，且保险人对免责条款负有提示和明确说明义务。", "pitfall": "“完全没有协商可能”属于绝对化表述，是判断题常见挖坑方式。"}, {"id": "M02-Q04", "type": "single", "stem": "“投保人交纳保费是确定的，保险人是否赔付是不确定的”，这体现保险合同的（　）。", "options": ["A. 附和性", "B. 射幸性", "C. 双务性", "D. 要式性"], "answer": "B", "explanation": "射幸性指是否给付取决于偶然保险事故是否发生。"}]}, {"id": "M02-KP02", "title": "保险合同的主体、客体与单证", "summary": "主体：保险人（承保人）、投保人、被保险人、受益人、保单所有人；当事人为投保人与保险人，关系人为被保险人与受益人。客体：形式上是保险标的，实质上是保险利益。单证：投保单、暂保单、保险单、条款、批单（批单效力通常优于保险单正文）。", "questions": [{"id": "M02-Q05", "type": "single", "stem": "保险合同客体实质上是（　）。", "options": ["A. 保险标的", "B. 保险利益", "C. 保险金额", "D. 保险费"], "answer": "B", "explanation": "保险合同形式上的客体是保险标的，实质上的客体是保险利益。"}, {"id": "M02-Q06", "type": "single", "stem": "保险合同形式上的客体是（　），实质上的客体是（　）。", "options": ["A. 保险标的；保险利益", "B. 保险利益；保险标的", "C. 保险金额；保险费", "D. 受益人；投保人"], "answer": "A", "explanation": "形式客体为保险标的，实质客体为保险利益。"}, {"id": "M02-Q07", "type": "single", "stem": "“以房屋火灾保险为例，形式标的为房屋，实质保障的是房主对房屋的所有权利益”，这说明（　）。", "options": ["A. 保险标的就是保险利益", "B. 保险标的是形式客体，保险利益是实质客体", "C. 保险金额是实质客体", "D. 保险利益等同于保险价值"], "answer": "B", "explanation": "该例正好说明形式客体（标的）与实质客体（保险利益）的区分。"}, {"id": "M02-Q08", "type": "judge", "stem": "批单与保险单正文内容冲突时，通常以批单为准。", "options": ["对", "错"], "answer": "对", "explanation": "批单用于变更合同内容，其效力通常优于保险单正文。"}, {"id": "M02-Q09", "type": "single", "stem": "投保人表达投保意愿的文件是（　），保险人出具的正式合同证明是（　）。", "options": ["A. 暂保单；投保单", "B. 投保单；保险单", "C. 保险单；批单", "D. 批单；条款"], "answer": "B", "explanation": "投保单是投保人表达投保意愿的文件；保险单是正式合同的证明。"}, {"id": "M02-Q10", "type": "single", "stem": "下列关于保险合同当事人的表述，正确的是（　）。", "options": ["A. 当事人是投保人和被保险人", "B. 当事人是投保人和保险人", "C. 当事人是被保险人和受益人", "D. 关系人是投保人和保险人"], "answer": "B", "explanation": "合同当事人为投保人与保险人；被保险人和受益人是关系人。", "pitfall": "“当事人/关系人”的归属极易互换。"}, {"id": "M02-Q11", "type": "multiple", "stem": "下列属于保险合同关系人的是（　）。", "options": ["A. 被保险人", "B. 受益人", "C. 投保人", "D. 保险人"], "answer": ["A", "B"], "explanation": "关系人为被保险人和受益人；投保人、保险人属于当事人。"}, {"id": "M02-Q12", "type": "single", "stem": "在人身保险中，享有死亡保险金请求权的人是（　）。", "options": ["A. 保险人", "B. 投保人", "C. 被保险人", "D. 受益人"], "answer": "D", "explanation": "受益人由被保险人或投保人指定，享有死亡保险金请求权。"}, {"id": "M02-Q13", "type": "judge", "stem": "保单所有人一定是投保人，且不可变更。", "options": ["对", "错"], "answer": "错", "explanation": "保单所有人是对保单拥有所有权的人，通常为投保人，但可以变更。"}]}, {"id": "M02-KP03", "title": "保险利益（可保利益）的定义、含义与目的", "summary": "保险利益：投保人或被保险人对保险标的具有的法律上承认的利益。三含义：合法性、经济性、可用货币衡量。三目的：避免赌博行为、防止道德风险、便于衡量损失避免纠纷。", "questions": [{"id": "M02-Q14", "type": "short", "stem": "简述保险利益原则的三个目的。", "answer": "①避免赌博行为；②防止道德风险；③便于衡量损失、避免纠纷。", "explanation": "三个目的需完整作答，缺一扣分。"}, {"id": "M02-Q15", "type": "multiple", "stem": "保险利益应当具备的含义包括（　）。", "options": ["A. 合法性", "B. 经济性，会造成经济损失", "C. 可用货币衡量", "D. 可以用情感价值衡量"], "answer": ["A", "B", "C"], "explanation": "保险利益须具合法性、经济性并可用货币衡量。", "pitfall": "人身保险的保险利益自有其特殊性，但“情感价值”不能作为保险利益的衡量标准。"}, {"id": "M02-Q16", "type": "judge", "stem": "保险利益的主体通常是投保人或被保险人；受益人一般不需要对被保险人具有保险利益。", "options": ["对", "错"], "answer": "对", "explanation": "保险利益的主体是投保人/被保险人；受益人一般不需要对被保险人具有保险利益。", "pitfall": "把保险利益主体错记成“保单所有人或受益人”是常见错误。"}, {"id": "M02-Q17", "type": "single", "stem": "保险利益的含义可概括为（　）。", "options": ["A. 因标的完好而受益，因标的受损而受害", "B. 因投保而获利", "C. 对保险金额的所有权", "D. 对保险费的请求权"], "answer": "A", "explanation": "保险利益即因标的完好而受益、因标的受损而受害的法律上承认的利益。"}]}, {"id": "M02-KP04", "title": "保险利益的时点要求与投保关系", "summary": "财产险：被保险人在保险事故发生时必须具有保险利益。人身险：投保人在合同订立时对被保险人必须具有保险利益，事故发生时通常不要求。财产险投保关系：所有人、抵押权人、承租人、占有人。人身险投保关系（保险法第31条）：本人；配偶、子女、父母；有抚养赡养扶养关系的家庭其他成员、近亲属；有劳动关系的劳动者；被保险人同意投保人为其订立合同视为有保险利益。", "questions": [{"id": "M02-Q18", "type": "judge", "stem": "人身保险要求保险事故发生时投保人仍对被保险人具有保险利益。", "options": ["对", "错"], "answer": "错", "explanation": "人身保险只要求投保人在合同订立时对被保险人具有保险利益。", "pitfall": "人身险的时点是“订立时”，财产险的时点是“事故发生时”，两者最易互换。"}, {"id": "M02-Q19", "type": "judge", "stem": "财产保险要求被保险人在保险事故发生时对保险标的具有保险利益。", "options": ["对", "错"], "answer": "对", "explanation": "财产险强调事故发生时被保险人须有保险利益。"}, {"id": "M02-Q20", "type": "single", "stem": "根据我国保险法规定，人身保险中投保人对被保险人具有保险利益的时点是（　）。", "options": ["A. 合同订立时", "B. 保险事故发生时", "C. 理赔时", "D. 合同终止时"], "answer": "A", "explanation": "人身险要求订立合同时具有保险利益。"}, {"id": "M02-Q21", "type": "multiple", "stem": "根据我国保险法第31条，投保人对下列哪些人员具有保险利益（　）。", "options": ["A. 本人", "B. 配偶、子女、父母", "C. 与投保人有劳动关系的劳动者", "D. 被保险人同意投保人为其订立合同的"], "answer": ["A", "B", "C", "D"], "explanation": "第31条还包括与投保人有抚养、赡养、扶养关系的家庭其他成员、近亲属。"}, {"id": "M02-Q22", "type": "multiple", "stem": "下列主体对财产保险标的可以具有保险利益的是（　）。", "options": ["A. 财产所有人", "B. 抵押权人", "C. 承租人", "D. 占有人"], "answer": ["A", "B", "C", "D"], "explanation": "财产所有人、抵押权人、承租人、占有人均可对财产标的具有保险利益。"}, {"id": "M02-Q23", "type": "judge", "stem": "人身保险中，若投保人与被保险人之间的亲属关系消失（如离婚），原合同当然无效。", "options": ["对", "错"], "answer": "错", "explanation": "人身险只要求订立时有保险利益，婚姻破裂并不当然导致合同无效，但可以变更投保人等。", "pitfall": "“当然无效”是绝对化表述，与人身险时点规则相矛盾。"}, {"id": "M02-Q24", "type": "single", "stem": "财产保险中保险标的转让（易主）时，通常应当（　）。", "options": ["A. 无需作任何处理", "B. 通知保险人", "C. 直接解除合同", "D. 由保险人重新核保后原合同自动失效"], "answer": "B", "explanation": "保险标的转让会导致财产险保险利益变化，通常需通知保险人；货物运输险等特定险种除外。", "pitfall": "“货物运输险等除外”这一例外常被忽略。"}]}, {"id": "M02-KP05", "title": "最大诚信原则", "summary": "包括告知、保证、弃权与禁止反言。告知：订立合同前投保人/被保险人应如实告知保险人询问的重要事实，我国采询问告知主义（不是无限告知）；保险人应说明合同内容，尤其是免责条款。保证：承诺做或不做某事，或某种状态存在，违反保证保险人可解约或拒赔。弃权：保险人知道有解除事由或违约仍放弃权利。禁止反言：保险人已使对方合理信赖其不会主张权利，事后不得反悔。", "questions": [{"id": "M02-Q25", "type": "multiple", "stem": "最大诚信原则的内容包括（　）。", "options": ["A. 告知", "B. 保证", "C. 弃权", "D. 禁止反言"], "answer": ["A", "B", "C", "D"], "explanation": "最大诚信原则包括告知、保证、弃权与禁止反言。"}, {"id": "M02-Q26", "type": "single", "stem": "保险人明知投保人未如实告知仍然承保、继续收费，事后不得再以此拒赔，这属于（　）。", "options": ["A. 告知", "B. 保证", "C. 弃权与禁止反言", "D. 近因"], "answer": "C", "explanation": "保险人放弃权利并已使对方合理信赖，构成弃权与禁止反言。"}, {"id": "M02-Q27", "type": "judge", "stem": "我国保险法关于告知义务采取的是询问告知主义。", "options": ["对", "错"], "answer": "对", "explanation": "我国采询问告知主义，投保人只需如实告知保险人询问的重要事实，而非无限告知。", "pitfall": "“无限告知”是英美部分法域的规则，不要混用。"}, {"id": "M02-Q28", "type": "short", "stem": "简述最大诚信原则的主要内容。", "answer": "最大诚信原则包括：①告知，订立合同前投保人、被保险人应如实告知保险人询问的重要事实（我国采询问告知主义），保险人应说明合同内容尤其是免责条款；②保证，合同约定做或不做某事、或某种状态存在，违反则保险人可解约或拒赔；③弃权，保险人知道解除事由或违约仍放弃权利；④禁止反言，保险人已使对方合理信赖其不会主张权利，事后不得反悔。", "explanation": "答题要点：告知、保证、弃权、禁止反言四要素，并点明询问告知主义。"}, {"id": "M02-Q29", "type": "judge", "stem": "保险公司若在承保阶段已知道存在问题仍然承保，事后可以随时以投保关系不合理为由拒赔。", "options": ["对", "错"], "answer": "错", "explanation": "受最大诚信、弃权与禁止反言约束，保险人明知仍承保的，后不得随意拒赔。"}]}, {"id": "M02-KP06", "title": "近因原则", "summary": "近因：引起保险事故发生的最直接、最有效、起主导或支配作用的原因，即使时间上不是最近。一连串事故导致后果时只看近因，不看最初起因。", "questions": [{"id": "M02-Q30", "type": "judge", "stem": "近因就是时间上距离损失最近的原因。", "options": ["对", "错"], "answer": "错", "explanation": "近因是最直接、最有效、起主导或支配作用的原因，时间上不一定最近。", "pitfall": "本节最经典的坑：把“近因”误读为“时间最近的原因”。"}, {"id": "M02-Q31", "type": "short", "stem": "简述近因原则的含义。", "answer": "近因是引起保险事故发生的最直接、最有效、起主导或支配作用的原因，即使时间上不是最近；当一连串事故导致损失后果时，应判断近因是否属于保险责任，而不看最初的起因。", "explanation": "答题要点：最直接、最有效、起主导作用 + 时间上不一定最近 + 一连串事故只看近因。"}, {"id": "M02-Q32", "type": "single", "stem": "判断损失是否属于保险责任时，应当依据（　）。", "options": ["A. 时间上最先发生的原因", "B. 时间上最后发生的原因", "C. 最直接、最有效、起主导作用的原因", "D. 被保险人主张的原因"], "answer": "C", "explanation": "近因是起主导支配作用的原因，既非最先也非最后。"}]}, {"id": "M02-KP07", "title": "损失补偿原则", "summary": "保险合同生效后，保险标的发生保险责任范围内损失，通过赔偿使被保险人恢复到受灾前经济原状，但不能因损失获得额外收益。原因：避免投保人获利、减少道德风险。三个限额：以实际损失为限、以保险金额为限、以保险利益为限。", "questions": [{"id": "M02-Q33", "type": "multiple", "stem": "损失补偿原则的三个限额是（　）。", "options": ["A. 以实际损失为限", "B. 以保险金额为限", "C. 以保险利益为限", "D. 以保险费为限"], "answer": ["A", "B", "C"], "explanation": "赔偿受实际损失、保险金额、保险利益三个限额约束。", "pitfall": "“以保险费为限”是干扰项，保费不是赔偿限额。"}, {"id": "M02-Q34", "type": "short", "stem": "为什么损失补偿原则要受三个限额的约束？", "answer": "为防止被保险人通过保险获得额外收益、降低道德风险，保险赔偿不能超过其实际损失；同时赔偿也不能超过合同约定的保险金额，且不能超过被保险人对保险标的拥有的保险利益，从而确保补偿的合理性和真实性。", "explanation": "答题要点：防止获利 + 降低道德风险 + 三个限额各自的意义。"}, {"id": "M02-Q35", "type": "judge", "stem": "损失补偿原则的核心是使被保险人的经济状况恢复到损失发生前，而不能因保险事故获利。", "options": ["对", "错"], "answer": "对", "explanation": "恢复原状、不得获利是损失补偿原则的核心。"}, {"id": "M02-Q36", "type": "multiple", "stem": "财产保险的赔偿方式通常包括（　）。", "options": ["A. 现金赔偿", "B. 更换", "C. 修理", "D. 加倍赔付"], "answer": ["A", "B", "C"], "explanation": "财产险赔偿方式为现金、更换、修理。"}]}]}, {"id": "M03", "name": "保险学基础·保额、赔偿计算与承保能力", "source": "保险学复习资料.docx（第十~十三节）", "knowledgePoints": [{"id": "M03-KP01", "title": "保险金额、保险价值与保险利益的关系", "summary": "保险金额：保险人承担赔偿或给付保险金责任的最高限额，也是计算保险费的依据。保险价值：保险标的在某一特定时期、地点以金钱估计的实际价值，通常为市场价。保险利益是前提。", "questions": [{"id": "M03-Q01", "type": "single", "stem": "保险人承担赔偿或给付保险金责任的最高限额是（　）。", "options": ["A. 保险价值", "B. 保险金额", "C. 保险利益", "D. 保险费"], "answer": "B", "explanation": "保险金额是赔付的最高限额，也是计算保险费的依据。"}, {"id": "M03-Q02", "type": "single", "stem": "保险标的在某一特定时期、地点以金钱估计的实际价值是（　）。", "options": ["A. 保险金额", "B. 保险价值", "C. 赔偿限额", "D. 免赔额"], "answer": "B", "explanation": "保险价值是标的在特定时间、地点的实际价值，通常为市场价。"}, {"id": "M03-Q03", "type": "short", "stem": "简述保险金额、保险价值、保险利益三者之间的关系。", "answer": "保险利益是前提，投保人或被保险人必须对保险标的具有法律承认的利益；财产保险中，保险金额通常不应超过保险价值，超额部分无效；赔偿金额同时受实际损失、保险金额和保险利益三者制约，损失补偿原则主要适用于财产保险。", "explanation": "答题要点：保险利益是前提；保额≤保险价值（财产险）；赔偿受三个限额约束。"}, {"id": "M03-Q04", "type": "judge", "stem": "保险金额可以超过保险价值，超过部分同样有效并应予以赔偿。", "options": ["对", "错"], "answer": "错", "explanation": "超额保险中超过保险价值的部分无效，赔偿以保险价值/实际损失为限。"}]}, {"id": "M03-KP02", "title": "定值保险与不定值保险", "summary": "定值保险：合同约定保险价值，全损按约定价值赔，部分损失按约定价值比例赔。不定值保险：合同不约定保险价值，事故时按实际价值确定。", "questions": [{"id": "M03-Q05", "type": "single", "stem": "古董约定保险价值100万元，投保定值保险后发生全损，保险人应赔偿（　）。", "options": ["A. 按出险时市场价赔", "B. 按约定价值100万元赔", "C. 按残值扣除后赔", "D. 不予赔偿"], "answer": "B", "explanation": "定值保险全损时按合同约定的保险价值赔偿。"}, {"id": "M03-Q06", "type": "single", "stem": "房屋投保时价值100万元，出险时市价80万元，保额100万元，若为不定值保险且全损，应赔（　）。", "options": ["A. 100万元", "B. 80万元", "C. 90万元", "D. 20万元"], "answer": "B", "explanation": "不定值保险不约定保险价值，按事故时的实际价值确定，全损赔80万元。", "pitfall": "不要用投保时价值100万计算，不定值保险以出险时实际价值为准。"}, {"id": "M03-Q07", "type": "judge", "stem": "定值保险中，部分损失通常按约定价值比例赔付。", "options": ["对", "错"], "answer": "对", "explanation": "定值保险部分损失按约定保险价值比例计算赔款。"}]}, {"id": "M03-KP03", "title": "足额、不足额与超额保险及比例赔付", "summary": "足额：保额=保险价值，损失多少赔多少并以保额为限。不足额：保额<保险价值，通常比例赔付，赔款=损失×保险金额/保险价值。超额：保额>保险价值，超过部分无效，赔偿以保险价值/实际损失为限。", "questions": [{"id": "M03-Q08", "type": "single", "stem": "保险价值100万元，保额80万元，损失50万元，按不足额比例赔付应为（　）。", "options": ["A. 50万元", "B. 40万元", "C. 30万元", "D. 80万元"], "answer": "B", "explanation": "赔款＝损失×保额/保险价值＝50×80/100＝40万元。", "pitfall": "不是直接赔损失50万，也不是赔保额80万。"}, {"id": "M03-Q09", "type": "single", "stem": "保险价值100万元，保额120万元，发生全损时应赔（　）。", "options": ["A. 120万元", "B. 100万元", "C. 60万元", "D. 20万元"], "answer": "B", "explanation": "超额部分无效，赔偿以保险价值为限，全损赔100万元。", "pitfall": "按保额120万赔是最常见的错误。"}, {"id": "M03-Q10", "type": "single", "stem": "下列关于“足额保险”的说法，正确的是（　）。", "options": ["A. 保额小于保险价值", "B. 保额等于保险价值，损失多少赔多少并以保额为限", "C. 保额大于保险价值", "D. 保额与保险价值无关"], "answer": "B", "explanation": "足额保险指保险金额等于保险价值。"}, {"id": "M03-Q11", "type": "short", "stem": "某企业财产保险价值100万元，投保保额80万元，发生损失50万元。请计算保险人应赔付多少，并说明依据。", "answer": "应赔付40万元。该保险属于不足额保险（保额80万元＜保险价值100万元），按比例赔付：赔款＝损失×保险金额/保险价值＝50×80/100＝40万元。", "explanation": "计算题答题要点：先判断足额/不足额，再列公式并代入，最后写出结论。"}]}, {"id": "M03-KP04", "title": "重复投保与共保条款", "summary": "重复投保：同一标的、同一保险利益、同一保险事故，与两个以上保险人订立合同，保险金额总和超过保险价值；处理上各保险人按比例分摊，总赔偿不超过实际损失/保险价值。共保条款：为避免不足额保险，要求投保人自担部分。", "questions": [{"id": "M03-Q12", "type": "single", "stem": "保险价值100万元，甲乙两家保险公司各承保80万元，发生损失60万元，按比例分摊，甲应赔（　）。", "options": ["A. 30万元", "B. 60万元", "C. 40万元", "D. 80万元"], "answer": "A", "explanation": "甲赔款＝损失×甲保额/保额总和＝60×80/160＝30万元，乙同样赔30万元，合计60万元。", "pitfall": "重复保险分摊按“各保险人保额占比”，不是各赔损失的一半以外的随意算法。"}, {"id": "M03-Q13", "type": "judge", "stem": "重复保险中，各保险人分摊后的赔偿总额可以超过被保险人的实际损失。", "options": ["对", "错"], "answer": "错", "explanation": "受损失补偿原则约束，分摊后总赔偿不得超过实际损失/保险价值。"}, {"id": "M03-Q14", "type": "single", "stem": "某财产保险采用80%共保条款，保险价值100万元，投保人应保80万元，实际只保60万元，损失50万元，则保险人应赔（　）。", "options": ["A. 50万元", "B. 37.5万元", "C. 30万元", "D. 40万元"], "answer": "B", "explanation": "赔款＝损失×实际保额/应保额＝50×60/80＝37.5万元，被保险人自担12.5万元。", "pitfall": "共保条款的分母是“应保额（共保比例×保险价值）”，不是保险价值。"}, {"id": "M03-Q15", "type": "judge", "stem": "共保条款的目的之一是避免投保人不足额投保。", "options": ["对", "错"], "answer": "对", "explanation": "共保条款要求投保人按约定比例自担部分风险，以减少不足额投保的动机。"}]}, {"id": "M03-KP05", "title": "免赔额（绝对免赔与相对免赔）", "summary": "绝对免赔：损失超过免赔额时，只赔超过部分。相对免赔：损失达到免赔额时赔偿全部损失，未达到则不赔。", "questions": [{"id": "M03-Q16", "type": "single", "stem": "绝对免赔额为500元，保险标的损失1000元，保险人应赔（　）。", "options": ["A. 1000元", "B. 500元", "C. 1500元", "D. 0元"], "answer": "B", "explanation": "绝对免赔只赔超过免赔额的部分：1000－500＝500元。"}, {"id": "M03-Q17", "type": "single", "stem": "相对免赔额为500元，保险标的损失1000元（合同无其他约定），保险人通常应赔（　）。", "options": ["A. 500元", "B. 1000元", "C. 1500元", "D. 0元"], "answer": "B", "explanation": "相对免赔在损失达到免赔额时赔偿全部损失。", "pitfall": "绝对免赔只赔超出部分；相对免赔一旦达到则全赔。两者极易互换。"}, {"id": "M03-Q18", "type": "judge", "stem": "相对免赔额500元的情况下，若损失为400元，保险人应当赔偿400元。", "options": ["对", "错"], "answer": "错", "explanation": "相对免赔要求损失达到约定免赔额才赔，未达到则不赔。"}]}, {"id": "M03-KP06", "title": "代位求偿与赔偿限额", "summary": "代位求偿：保险人赔付后，在赔偿金额范围内代位行使被保险人对第三者的请求权。适用财产险，不适用人身险；保险人可在约定或条件下放弃代位求偿；被保险人不能随意放弃对第三者的追偿请求权，否则保险人可扣减或不赔。赔偿限额：保险人承担责任的最高额度，责任险常用。", "questions": [{"id": "M03-Q19", "type": "judge", "stem": "代位求偿原则适用于人身保险，也适用于财产保险。", "options": ["对", "错"], "answer": "错", "explanation": "代位求偿适用财产保险，不适用人身保险。", "pitfall": "人的生命健康无价，人身保险为给付性，不适用损失补偿及其派生规则。"}, {"id": "M03-Q20", "type": "short", "stem": "为什么人身保险一般不适用代位求偿？", "answer": "因为人的生命和健康无法用金钱准确衡量，人身保险多属于给付性合同，不适用损失补偿原则；而代位求偿是损失补偿原则的派生规则，故一般不能适用于人身保险。", "explanation": "答题要点：生命健康无价 + 人身险为给付性 + 代位求偿是损失补偿的派生规则。"}, {"id": "M03-Q21", "type": "single", "stem": "关于代位求偿，下列说法正确的是（　）。", "options": ["A. 保险人赔付后可代位行使被保险人对第三者的请求权", "B. 代位求偿所得可超过其实际赔付金额", "C. 被保险人可以随意放弃对第三者的追偿请求权而不影响赔付", "D. 代位求偿是保险利益原则的派生规则"], "answer": "A", "explanation": "保险人赔付后在赔偿金额范围内代位行使请求权；被保险人不能随意放弃追偿权，否则保险人可扣减或不赔。代位求偿是损失补偿原则的派生规则。", "pitfall": "B、C、D三项均设坑，尤其D把派生来源写错。"}, {"id": "M03-Q22", "type": "single", "stem": "责任保险中保险人承担责任的最高额度称为（　）。", "options": ["A. 保险价值", "B. 赔偿限额", "C. 免赔额", "D. 保险利益"], "answer": "B", "explanation": "赔偿限额是保险人承担责任的最高额度，责任保险中最常用。"}, {"id": "M03-Q23", "type": "judge", "stem": "保险人可以在约定或一定条件下放弃代位求偿权。", "options": ["对", "错"], "answer": "对", "explanation": "代位求偿权可由保险人在约定或条件下放弃。"}]}, {"id": "M03-KP07", "title": "承保能力", "summary": "中国保险法规定：保险公司对每一危险单位所承担的责任，不得超过其实有资本金加公积金总和的10%；超过部分应办理再保险。承保能力组成：法定承保能力（净自留）、再保合约、再保临分；同业再保不可算作公司自身承保能力。", "questions": [{"id": "M03-Q24", "type": "single", "stem": "保险公司对每一危险单位承担的责任，不得超过其实有资本金加公积金总和的（　）。", "options": ["A. 5%", "B. 10%", "C. 20%", "D. 30%"], "answer": "B", "explanation": "我国保险法规定为10%，超过部分应办理再保险。"}, {"id": "M03-Q25", "type": "multiple", "stem": "公司自身承保能力的组成包括（　）。", "options": ["A. 法定承保能力（净自留）", "B. 再保合约", "C. 再保临分", "D. 同业再保"], "answer": ["A", "B", "C"], "explanation": "同业再保不可算作公司自身承保能力。", "pitfall": "同一集团内或同业提供的再保安排，不能计入自身承保能力。"}, {"id": "M03-Q26", "type": "judge", "stem": "保险公司承保能力超过法定限额的部分，可以通过办理再保险予以安排。", "options": ["对", "错"], "answer": "对", "explanation": "超过法定自留限额的部分应通过再保险分出。"}]}]}, {"id": "M04", "name": "公司概况、战略与企业文化", "source": "鼎和保险培训知识点汇总.pdf（第一部分）", "knowledgePoints": [{"id": "M04-KP01", "title": "公司基本情况", "summary": "鼎和财产保险股份有限公司成立于2008年5月，总部位于深圳；定位为特色鲜明的全国性专家型财产保险公司，核心定位“能源行业保险专家”。经营范围涵盖机动车辆保险、财产损失保险、责任保险、信用保险和保证保险、短期健康和意外伤害保险、再保险、保险资金运用等。具有鲜明的南方电网股东背景，2021年完成“增资引战”。课件口径：注册资本60亿元；下辖15家省级分公司、183家三四级机构，员工3200余人（动态数据）。", "questions": [{"id": "M04-Q01", "type": "single", "stem": "鼎和财产保险股份有限公司成立于（　）。", "options": ["A. 2006年5月", "B. 2008年5月", "C. 2010年5月", "D. 2021年5月"], "answer": "B", "explanation": "鼎和保险成立于2008年5月。"}, {"id": "M04-Q02", "type": "single", "stem": "鼎和保险总部位于（　）。", "options": ["A. 广州", "B. 深圳", "C. 北京", "D. 上海"], "answer": "B", "explanation": "公司总部位于深圳。", "pitfall": "南方电网总部在广东，易与公司总部所在地混淆。"}, {"id": "M04-Q03", "type": "single", "stem": "鼎和保险的核心定位是（　）。", "options": ["A. 综合金融集团", "B. 能源行业保险专家", "C. 互联网保险公司", "D. 国内一流、国际知名保险公司"], "answer": "B", "explanation": "公司核心定位是“能源行业保险专家”。", "pitfall": "D项是“企业愿景”，不是定位，二者是本节第一大坑。"}, {"id": "M04-Q04", "type": "judge", "stem": "鼎和保险是一家特色鲜明的全国性专家型财产保险公司。", "options": ["对", "错"], "answer": "对", "explanation": "公司定位为特色鲜明的全国性专家型财产保险公司。"}, {"id": "M04-Q05", "type": "single", "stem": "鼎和保险于（　）完成“增资引战”，引入能源央企股东。", "options": ["A. 2018年", "B. 2019年", "C. 2021年", "D. 2023年"], "answer": "C", "explanation": "2021年完成“增资引战”，引入能源央企股东，进一步融入能源产业链生态。"}, {"id": "M04-Q06", "type": "multiple", "stem": "鼎和保险的经营范围包括（　）。", "options": ["A. 机动车辆保险、财产损失保险", "B. 责任保险、信用保险和保证保险", "C. 短期健康和意外伤害保险", "D. 再保险、保险资金运用"], "answer": ["A", "B", "C", "D"], "explanation": "公司经营范围涵盖非寿险主要领域，上述各项均包括。"}, {"id": "M04-Q07", "type": "judge", "stem": "公司课件口径注册资本为60亿元，该数据属于动态数据，考试前宜以最新正式材料为准。", "options": ["对", "错"], "answer": "对", "explanation": "注册资本、机构数、员工数均属动态数据，需与最新材料核对。", "pitfall": "另有资料引用截至2024年末的46.43亿元，属“资本金口径冲突”，注意区分年份。"}]}, {"id": "M04-KP02", "title": "企业文化的源头", "summary": "鼎和企业文化的三个鲜明特征：央企风范、南网基因、金融特色。鼎和文化根植南网，强调对南网文化的融合、发展、传承、弘扬。", "questions": [{"id": "M04-Q08", "type": "multiple", "stem": "鼎和企业文化的三个鲜明特征是（　）。", "options": ["A. 央企风范", "B. 南网基因", "C. 金融特色", "D. 国际视野"], "answer": ["A", "B", "C"], "explanation": "三个鲜明特征为央企风范、南网基因、金融特色。"}, {"id": "M04-Q09", "type": "multiple", "stem": "鼎和文化根植南网，强调对南网文化的（　）。", "options": ["A. 融合", "B. 发展", "C. 传承", "D. 弘扬"], "answer": ["A", "B", "C", "D"], "explanation": "融合、发展、传承、弘扬，四个词须完整记忆。"}]}, {"id": "M04-KP03", "title": "定位、使命、愿景", "summary": "企业定位：能源行业保险专家。企业使命：为更加清洁的美好生活提供专业风险管理。企业愿景：成为国内一流、国际知名保险公司。愿景完整表述：成为市场拓展能力强、风险管理能力强、效益优秀、管理优秀、客户服务优秀的国内一流、国际知名保险公司。", "questions": [{"id": "M04-Q10", "type": "single", "stem": "鼎和保险的企业使命是（　）。", "options": ["A. 成为国内一流、国际知名保险公司", "B. 为更加清洁的美好生活提供专业风险管理", "C. 能源行业保险专家", "D. 一言九鼎、和谐共赢"], "answer": "B", "explanation": "使命是“为更加清洁的美好生活提供专业风险管理”。"}, {"id": "M04-Q11", "type": "single", "stem": "鼎和保险的企业愿景是（　）。", "options": ["A. 能源行业保险专家", "B. 打造新型电力系统风险管理生态圈", "C. 成为国内一流、国际知名保险公司", "D. 成为行业第一"], "answer": "C", "explanation": "愿景是“成为国内一流、国际知名保险公司”。", "pitfall": "“打造新型电力系统风险管理生态圈”是能源业务/“211”工程的战略目标，不能替代企业愿景。"}, {"id": "M04-Q12", "type": "multiple", "stem": "愿景的完整表述中包含的“优秀/能力”要求有（　）。", "options": ["A. 市场拓展能力强、风险管理能力强", "B. 效益优秀", "C. 管理优秀", "D. 客户服务优秀"], "answer": ["A", "B", "C", "D"], "explanation": "两强三优：市场拓展能力强、风险管理能力强；效益优秀、管理优秀、客户服务优秀。"}, {"id": "M04-Q13", "type": "judge", "stem": "企业定位与企业家愿景是同一件事，都指“成为国内一流、国际知名保险公司”。", "options": ["对", "错"], "answer": "错", "explanation": "企业定位是“能源行业保险专家”，愿景是“成为国内一流、国际知名保险公司”。", "pitfall": "定位与愿景混淆是易错点第1条。"}]}, {"id": "M04-KP04", "title": "治企、经营与服务理念", "summary": "治企理念的“五个关键支柱”：员工、流程、客户、产品、品牌与信任（“品牌与信任”合并为一个支柱）。经营理念：诚实守信、以义取利、稳健审慎、守正创新、依法合规。中国特色金融文化“五要五不”。服务理念：与客户共创价值，赢得市场竞争。风险合规理念：严守底线、防范风险、合规经营、行稳致远。", "questions": [{"id": "M04-Q14", "type": "multiple", "stem": "治企理念的“五个关键支柱”包括（　）。", "options": ["A. 员工、流程", "B. 客户、产品", "C. 品牌与信任", "D. 品牌、信任"], "answer": ["A", "B", "C"], "explanation": "五个关键支柱为员工、流程、客户、产品、品牌与信任。", "pitfall": "“品牌与信任”合并为一个支柱，故称“五个”而非“六个”。"}, {"id": "M04-Q15", "type": "judge", "stem": "治企理念之所以称“五个关键支柱”，是因为“品牌”与“信任”被合并为一个支柱。", "options": ["对", "错"], "answer": "对", "explanation": "品牌与信任合并为一个支柱，故为五个。"}, {"id": "M04-Q16", "type": "multiple", "stem": "公司的经营理念包括（　）。", "options": ["A. 诚实守信、以义取利", "B. 稳健审慎、守正创新", "C. 依法合规", "D. 唯利是图"], "answer": ["A", "B", "C"], "explanation": "经营理念为诚实守信、以义取利、稳健审慎、守正创新、依法合规。"}, {"id": "M04-Q17", "type": "single", "stem": "中国特色金融文化“五要五不”中，“诚实守信”对应的是（　）。", "options": ["A. 不逾越底线", "B. 不唯利是图", "C. 不急功近利", "D. 不脱实向虚"], "answer": "A", "explanation": "诚实守信，不逾越底线；以义取利，不唯利是图；稳健审慎，不急功近利；守正创新，不脱实向虚；依法合规，不胡作非为。", "pitfall": "“五要五不”的五组对应关系必须一一记住，不能错位。"}, {"id": "M04-Q18", "type": "single", "stem": "“依法合规”对应的“五不”是（　）。", "options": ["A. 不逾越底线", "B. 不急功近利", "C. 不脱实向虚", "D. 不胡作非为"], "answer": "D", "explanation": "依法合规，不胡作非为。"}, {"id": "M04-Q19", "type": "single", "stem": "鼎和保险的服务理念是（　）。", "options": ["A. 与客户共创价值，赢得市场竞争", "B. 一言九鼎、和谐共赢", "C. 马上就办，办就办好", "D. 严守底线、防范风险"], "answer": "A", "explanation": "服务理念是“与客户共创价值，赢得市场竞争”。"}, {"id": "M04-Q20", "type": "multiple", "stem": "公司的风险合规理念包括（　）。", "options": ["A. 严守底线、防范风险", "B. 合规经营", "C. 行稳致远", "D. 效益优先"], "answer": ["A", "B", "C"], "explanation": "风险合规理念：严守底线、防范风险、合规经营、行稳致远。"}]}, {"id": "M04-KP05", "title": "人才、团队与工作理念", "summary": "人才理念：企业第一资源，发展竞争之本。领导人员要求：对党忠诚、勇于创新、治企有方、兴企有为、清正廉洁。员工队伍要求：团结奋斗、爱企敬业、精业笃行、创业创效、遵规守纪。销售队伍要求：开拓进取、直达客户、业务精湛、业绩卓越、诚信合规。工作理念：高、严、细、实、快，强调“马上就办，办就办好”。企业精神：勇于变革、乐于奉献。品牌形象：一言九鼎、和谐共赢。", "questions": [{"id": "M04-Q21", "type": "single", "stem": "鼎和保险的人才理念是（　）。", "options": ["A. 企业第一资源，发展竞争之本", "B. 高、严、细、实、快", "C. 一言九鼎、和谐共赢", "D. 勇于变革、乐于奉献"], "answer": "A", "explanation": "人才理念为“企业第一资源，发展竞争之本”。"}, {"id": "M04-Q22", "type": "multiple", "stem": "公司对领导人员的要求包括（　）。", "options": ["A. 对党忠诚、勇于创新", "B. 治企有方、兴企有为", "C. 清正廉洁", "D. 业绩卓越"], "answer": ["A", "B", "C"], "explanation": "领导人员要求为对党忠诚、勇于创新、治企有方、兴企有为、清正廉洁；“业绩卓越”是销售队伍要求。", "pitfall": "领导人员、员工队伍、销售队伍三套要求的词语容易互相串。"}, {"id": "M04-Q23", "type": "multiple", "stem": "公司对销售队伍的要求包括（　）。", "options": ["A. 开拓进取、直达客户", "B. 业务精湛、业绩卓越", "C. 诚信合规", "D. 清正廉洁"], "answer": ["A", "B", "C"], "explanation": "销售队伍要求：开拓进取、直达客户、业务精湛、业绩卓越、诚信合规。"}, {"id": "M04-Q24", "type": "single", "stem": "鼎和保险的工作理念是（　）。", "options": ["A. 高、严、细、实、快", "B. 快、准、狠、稳、实", "C. 诚、信、专、精、优", "D. 严、实、细、新、快"], "answer": "A", "explanation": "工作理念为“高、严、细、实、快”，强调“马上就办，办就办好”。"}, {"id": "M04-Q25", "type": "single", "stem": "鼎和保险的企业精神是（　）。", "options": ["A. 一言九鼎、和谐共赢", "B. 勇于变革、乐于奉献", "C. 团结奋斗、爱企敬业", "D. 守正创新、依法合规"], "answer": "B", "explanation": "企业精神为“勇于变革、乐于奉献”。", "pitfall": "A项是品牌形象，二者常被互换。"}, {"id": "M04-Q26", "type": "single", "stem": "“一言九鼎、和谐共赢”是鼎和的（　）。", "options": ["A. 企业精神", "B. 服务理念", "C. 品牌形象", "D. 人才理念"], "answer": "C", "explanation": "“一言九鼎、和谐共赢”是品牌形象。"}, {"id": "M04-Q27", "type": "multiple", "stem": "公司对员工队伍的要求包括（　）。", "options": ["A. 团结奋斗、爱企敬业", "B. 精业笃行", "C. 创业创效", "D. 遵规守纪"], "answer": ["A", "B", "C", "D"], "explanation": "员工队伍要求：团结奋斗、爱企敬业、精业笃行、创业创效、遵规守纪。"}]}, {"id": "M04-KP06", "title": "公司战略主线与三类能力角色", "summary": "工作主线：夯基础、练内功、拓圈子。发展路径：植根南网、做强能源、做大市场。战略核心：围绕“能源”领域和“专家”定位，走差异化、特色化、专业化发展道路。在南网产业金融中的角色：重要组成、践行央企产业金融战略使命、做好“五篇大文章”、服务南网转型和新型能源体系/新型电力系统建设、发挥南网利润第二增长曲线作用。三类能力角色：能源风险管理商、能源产融生态运营商、能源科技创新服务商。", "questions": [{"id": "M04-Q28", "type": "single", "stem": "鼎和保险的工作主线是（　）。", "options": ["A. 植根南网、做强能源、做大市场", "B. 夯基础、练内功、拓圈子", "C. 高、严、细、实、快", "D. 差异化、特色化、专业化"], "answer": "B", "explanation": "工作主线为“夯基础、练内功、拓圈子”。", "pitfall": "A项是发展路径，二者极易互换。"}, {"id": "M04-Q29", "type": "single", "stem": "鼎和保险的发展路径是（　）。", "options": ["A. 夯基础、练内功、拓圈子", "B. 植根南网、做强能源、做大市场", "C. 稳中求进、提质增效", "D. 创新驱动、转型发展"], "answer": "B", "explanation": "发展路径为“植根南网、做强能源、做大市场”。"}, {"id": "M04-Q30", "type": "multiple", "stem": "公司战略核心强调围绕“能源”领域和“专家”定位，走（　）发展道路。", "options": ["A. 差异化", "B. 特色化", "C. 专业化", "D. 规模化"], "answer": ["A", "B", "C"], "explanation": "走差异化、特色化、专业化发展道路。"}, {"id": "M04-Q31", "type": "multiple", "stem": "公司三类能力角色包括（　）。", "options": ["A. 能源风险管理商", "B. 能源产融生态运营商", "C. 能源科技创新服务商", "D. 综合金融控股商"], "answer": ["A", "B", "C"], "explanation": "三类能力角色：能源风险管理商、能源产融生态运营商、能源科技创新服务商。"}, {"id": "M04-Q32", "type": "multiple", "stem": "鼎和在南网产业金融中的角色包括（　）。", "options": ["A. 南网产业金融的重要组成", "B. 践行央企产业金融战略使命", "C. 做好科技金融、绿色金融、普惠金融、养老金融、数字金融“五篇大文章”", "D. 发挥南网利润第二增长曲线作用"], "answer": ["A", "B", "C", "D"], "explanation": "还包括服务南网转型和新型能源体系、新型电力系统建设。"}, {"id": "M04-Q33", "type": "multiple", "stem": "“五篇大文章”指的是（　）。", "options": ["A. 科技金融、绿色金融", "B. 普惠金融", "C. 养老金融", "D. 数字金融"], "answer": ["A", "B", "C", "D"], "explanation": "科技金融、绿色金融、普惠金融、养老金融、数字金融。"}]}, {"id": "M04-KP07", "title": "“三个同心圆”业务布局", "summary": "从内到外：电网 → 能源 → 市场。内层核心圆=电网业务（植根南网、筑牢根基，“压舱石”，电网业务部）；中层拓展圆=能源业务（做强能源、延伸产业链，能源业务部）；外层价值圆=市场化业务（做大市场、激活生态，培育第二增长曲线，市场部）。总体逻辑：核心稳固、拓展延伸、价值跃升。", "questions": [{"id": "M04-Q34", "type": "single", "stem": "“三个同心圆”从内到外的顺序是（　）。", "options": ["A. 电网→能源→市场", "B. 市场→能源→电网", "C. 能源→电网→市场", "D. 电网→市场→能源"], "answer": "A", "explanation": "内层电网、中层能源、外层市场。"}, {"id": "M04-Q35", "type": "single", "stem": "三个同心圆中，被定位为公司生存发展的“压舱石”的是（　）。", "options": ["A. 内层核心圆（电网业务）", "B. 中层拓展圆（能源业务）", "C. 外层价值圆（市场化业务）", "D. 三者并列"], "answer": "A", "explanation": "内层核心圆即电网业务，是生存发展的“压舱石”。"}, {"id": "M04-Q36", "type": "single", "stem": "中层拓展圆对应的战略作用是（　）。", "options": ["A. 植根南网、筑牢根基", "B. 做强能源、延伸产业链，形成差异化竞争优势", "C. 做大市场、激活生态，培育第二增长曲线", "D. 防范风险、合规经营"], "answer": "B", "explanation": "中层拓展圆为能源业务，做强能源、延伸产业链。"}, {"id": "M04-Q37", "type": "single", "stem": "“三个同心圆”中，外层价值圆的归口部门是（　）。", "options": ["A. 电网业务部", "B. 能源业务部", "C. 市场部", "D. 财产险部"], "answer": "C", "explanation": "外层价值圆为市场化业务，主要责任部门是市场部。"}, {"id": "M04-Q38", "type": "judge", "stem": "“三个同心圆”的总体逻辑是核心稳固、拓展延伸、价值跃升。", "options": ["对", "错"], "answer": "对", "explanation": "以核心圈层深耕为基础，向能源产业链延伸，再向市场化客户拓展。"}, {"id": "M04-Q39", "type": "single", "stem": "培育公司“第二增长曲线”对应的是（　）。", "options": ["A. 电网业务", "B. 能源业务", "C. 市场化业务", "D. 再保险业务"], "answer": "C", "explanation": "外层价值圆的市场化业务承担“做大市场、激活生态、培育第二增长曲线”的作用。"}]}, {"id": "M04-KP08", "title": "新型电力系统“211 生态工程”", "summary": "“211”即两库、一台、一圈：两库=新型电力系统风险库、保险产品库；一台=新型电力系统风险管理生态平台；一圈=新型电力系统风险管理生态圈。建设目标：通过产学研融合，形成多方参与、开源共建、互利互惠的新型电力系统风险治理生态。", "questions": [{"id": "M04-Q40", "type": "single", "stem": "“211 生态工程”中的“2”指的是（　）。", "options": ["A. 两家公司", "B. 风险库、产品库", "C. 两个平台", "D. 两个圈层"], "answer": "B", "explanation": "“两库”即新型电力系统风险库和保险产品库。"}, {"id": "M04-Q41", "type": "single", "stem": "“211 生态工程”中的“1 台”指的是（　）。", "options": ["A. 一张保单", "B. 一个部门", "C. 新型电力系统风险管理生态平台", "D. 一支专家队伍"], "answer": "C", "explanation": "“一台”为新型电力系统风险管理生态平台。"}, {"id": "M04-Q42", "type": "single", "stem": "“211 生态工程”中的“1 圈”指的是（　）。", "options": ["A. 三个同心圆", "B. 新型电力系统风险管理生态圈", "C. 客户圈层", "D. 产业链上下游圈"], "answer": "B", "explanation": "“一圈”为新型电力系统风险管理生态圈。"}, {"id": "M04-Q43", "type": "judge", "stem": "“211”是指公司设定的三个数字目标，与风险库、产品库无关。", "options": ["对", "错"], "answer": "错", "explanation": "“211”即两库（风险库、产品库）、一台（生态平台）、一圈（生态圈），不是三个数字目标。", "pitfall": "易错点第3条：把“211”误解为数字目标。资料中个别“2111”应为笔误。"}, {"id": "M04-Q44", "type": "judge", "stem": "“211”工程的建设目标是形成多方参与、开源共建、互利互惠的新型电力系统风险治理生态。", "options": ["对", "错"], "answer": "对", "explanation": "通过产学研融合实现上述目标。"}]}, {"id": "M04-KP09", "title": "能源战略背景与“一个领跑、五个一流”", "summary": "能源安全新战略于2014年提出，核心是“四个革命、一个合作”：能源消费革命、能源供给革命、能源技术革命、能源体制革命，全方位加强国际合作。“双碳”目标：2030年前碳达峰，2060年前碳中和。南方电网安全生产理念：一切事故都可以预防。一个领跑：在能源保险领域实现领跑。五个一流：经营评价水平一流、风险合规管理一流、综合竞争实力一流、效率效益指标一流、价值创造能力一流。", "questions": [{"id": "M04-Q45", "type": "multiple", "stem": "能源安全新战略的“四个革命”包括（　）。", "options": ["A. 能源消费革命", "B. 能源供给革命", "C. 能源技术革命", "D. 能源体制革命"], "answer": ["A", "B", "C", "D"], "explanation": "另有“一个合作”即全方位加强国际合作。"}, {"id": "M04-Q46", "type": "single", "stem": "能源安全新战略的“一个合作”是指（　）。", "options": ["A. 加强区域合作", "B. 全方位加强国际合作", "C. 加强政企合作", "D. 加强产学研合作"], "answer": "B", "explanation": "“一个合作”即全方位加强国际合作。"}, {"id": "M04-Q47", "type": "single", "stem": "我国“双碳”目标中的碳中和目标是（　）。", "options": ["A. 2025年前", "B. 2030年前", "C. 2060年前", "D. 2100年前"], "answer": "C", "explanation": "2030年前碳达峰，2060年前碳中和。", "pitfall": "两个年份最易互换：碳达峰2030，碳中和2060。"}, {"id": "M04-Q48", "type": "judge", "stem": "能源安全新战略于2014年提出。", "options": ["对", "错"], "answer": "对", "explanation": "能源安全新战略于2014年提出。"}, {"id": "M04-Q49", "type": "single", "stem": "南方电网的安全生产理念是（　）。", "options": ["A. 安全第一、预防为主", "B. 一切事故都可以预防", "C. 零事故、零伤亡", "D. 严守底线、防范风险"], "answer": "B", "explanation": "南方电网安全生产理念：一切事故都可以预防。"}, {"id": "M04-Q50", "type": "single", "stem": "“一个领跑”指的是在（　）领域实现领跑。", "options": ["A. 车险", "B. 能源保险", "C. 互联网保险", "D. 责任保险"], "answer": "B", "explanation": "在能源保险领域实现领跑。"}, {"id": "M04-Q51", "type": "multiple", "stem": "“五个一流”包括（　）。", "options": ["A. 经营评价水平一流", "B. 风险合规管理一流", "C. 综合竞争实力一流", "D. 效率效益指标一流、价值创造能力一流"], "answer": ["A", "B", "C", "D"], "explanation": "五个一流：经营评价、风险合规管理、综合竞争实力、效率效益指标、价值创造能力。"}]}]}, {"id": "M05", "name": "组织架构与部门职责", "source": "鼎和保险培训知识点汇总.pdf（第二部分）", "knowledgePoints": [{"id": "M05-KP01", "title": "电网业务部", "summary": "部门定位：负责三个同心圆中的电网核心圆，深耕南方电网，是公司业务基本盘和“压舱石”。客户分团体客户与个人客户；业务分统保业务、电网团客业务、电网个客业务。下设统保业务、供应链业务、产业链业务、电网员工业务、电网服务五个团队。统保四大类产品：财产险、机器损坏险、责任险、工程险。理赔服务原则：快响应、快施救、预付款、不惜赔。", "questions": [{"id": "M05-Q01", "type": "single", "stem": "电网业务部负责三个同心圆中的（　）。", "options": ["A. 电网核心圆", "B. 能源拓展圆", "C. 价值圆", "D. 生态圈"], "answer": "A", "explanation": "电网业务部负责电网核心圆，是公司业务基本盘和“压舱石”。"}, {"id": "M05-Q02", "type": "multiple", "stem": "电网业务可分为（　）。", "options": ["A. 统保业务", "B. 电网团客业务", "C. 电网个客业务", "D. 再保险业务"], "answer": ["A", "B", "C"], "explanation": "统保业务、电网团客业务、电网个客业务三类。"}, {"id": "M05-Q03", "type": "multiple", "stem": "电网统保四大类产品是（　）。", "options": ["A. 财产险", "B. 机器损坏险", "C. 责任险", "D. 工程险"], "answer": ["A", "B", "C", "D"], "explanation": "统保四大类：财产险、机器损坏险、责任险、工程险。"}, {"id": "M05-Q04", "type": "single", "stem": "“因原材料缺陷、操作失误、电力原因等内部原因导致的机器损坏”属于（　）的保障范围。", "options": ["A. 电网财产一切险", "B. 电网机器损坏险", "C. 供电责任险", "D. 建筑工程一切险"], "answer": "B", "explanation": "机器损坏险主要保障内部原因导致的机器损坏。", "pitfall": "财产一切险保障的是外力破坏、自然灾害或意外事故导致的外部原因损失。"}, {"id": "M05-Q05", "type": "multiple", "stem": "电网理赔服务原则包括（　）。", "options": ["A. 快响应、快施救", "B. 预付款", "C. 不惜赔", "D. 先拒赔后核查"], "answer": ["A", "B", "C"], "explanation": "理赔服务原则：快响应、快施救、预付款、不惜赔。"}, {"id": "M05-Q06", "type": "single", "stem": "电网业务部中负责对接南网供应链集团、拓展供应链及平台型业务的团队是（　）。", "options": ["A. 统保业务团队", "B. 供应链业务团队", "C. 产业链业务团队", "D. 电网服务团队"], "answer": "B", "explanation": "供应链业务团队对接南网供应链集团；产业链业务团队拓展上下游企业及外部资源。"}, {"id": "M05-Q07", "type": "single", "stem": "保险在南网体系中发挥“经济减震器”作用，其含义是（　）。", "options": ["A. 提高公司利润", "B. 横向在各单位间分散损失，纵向平滑重大灾害对单个年度经营结果的冲击", "C. 增加保费收入", "D. 减少税收"], "answer": "B", "explanation": "横向分散损失、纵向平滑年度冲击，是“经济减震器”的准确含义。"}, {"id": "M05-Q08", "type": "single", "stem": "电网业务部开展风险评估、灾害预警与防灾防损所依托的平台是（　）。", "options": ["A. 能源哨兵系统", "B. 鼎和风险云", "C. 鼎好医", "D. 鼎好车"], "answer": "B", "explanation": "电网业务部通过专家队伍和“鼎和风险云”开展风险减量服务。", "pitfall": "“能源哨兵系统”是能源业务部的核心工具，不要混淆。"}, {"id": "M05-Q09", "type": "multiple", "stem": "电网业务部员工保障类产品包括（　）。", "options": ["A. 团体意外险、医疗险", "B. 重大疾病险", "C. “全家福”“企福保”等家庭保障产品", "D. 出口信用险"], "answer": ["A", "B", "C"], "explanation": "员工保障包括团体意外险、医疗险、重大疾病险及“全家福”“企福保”等；并通过“鼎好医”“鼎好车”提供增值服务。"}]}, {"id": "M05-KP02", "title": "能源业务部", "summary": "部门定位：负责能源拓展圆，围绕能源央企、综合能源企业及南网供应链开展专业保险服务。六项核心职能：能源央企业务、综合能源业务、南网供应链业务、产品创新、风险减量、销售支持。三大业务特色：新型电力系统保险产品创新、新型储能业务差异化优势、能源专业风险减量服务。风险减量三阶段：保前（风险查勘、建档案）、保中（防灾防损、风险预警）、灾后（应急查勘、定损、协助恢复生产）。核心工具“能源哨兵系统”。", "questions": [{"id": "M05-Q10", "type": "single", "stem": "能源业务部对应三个同心圆中的（　）。", "options": ["A. 电网核心圆", "B. 能源拓展圆", "C. 价值圆", "D. 生态圈"], "answer": "B", "explanation": "能源业务部负责能源拓展圆。"}, {"id": "M05-Q11", "type": "multiple", "stem": "能源业务部的三大业务特色包括（　）。", "options": ["A. 新型电力系统保险产品创新", "B. 新型储能业务形成差异化优势", "C. 能源专业风险减量服务", "D. 车险直销"], "answer": ["A", "B", "C"], "explanation": "三大业务特色为产品创新、储能业务差异化、专业风险减量服务。"}, {"id": "M05-Q12", "type": "single", "stem": "能源业务部风险减量工作“保前”阶段的主要工作是（　）。", "options": ["A. 防灾防损、风险预警", "B. 风险查勘、建立客户风险档案", "C. 应急查勘、定损", "D. 协助恢复生产"], "answer": "B", "explanation": "保前为风险查勘、建立客户风险档案；保中为防灾防损、风险预警；灾后为应急查勘、定损、协助恢复生产。", "pitfall": "三阶段的动作顺序最易错位。"}, {"id": "M05-Q13", "type": "single", "stem": "能源业务部的核心风险监测工具是（　）。", "options": ["A. 鼎和风险云", "B. 能源哨兵系统", "C. 鼎好医", "D. 鼎好车"], "answer": "B", "explanation": "“能源哨兵系统”利用卫星遥感、雷达等技术监测滑坡、沉降、山火和气象灾害等风险。"}, {"id": "M05-Q14", "type": "single", "stem": "被称为“行业首款电化学储能专属保险系列”的产品是（　）。", "options": ["A. 储能保系列", "B. 安心保系列", "C. 能源保系列", "D. 电力保系列"], "answer": "A", "explanation": "“储能保”系列是行业首款电化学储能专属保险系列，覆盖储能项目全生命周期。"}, {"id": "M05-Q15", "type": "single", "stem": "储能项目“财务损失”环节对应的保险产品是（　）。", "options": ["A. 电化学储能产品质量保险", "B. 电化学储能建筑/安装工程保险", "C. 峰谷电价价差收入损失保险", "D. 第三者责任险"], "answer": "C", "explanation": "财务损失环节对应峰谷电价价差收入损失保险。", "pitfall": "生产制造=产品质量保险；现场施工=建筑/安装工程保险；运行阶段=财产一切险、机器损坏险、第三者责任险。"}, {"id": "M05-Q16", "type": "single", "stem": "V2G 指的是（　）。", "options": ["A. Vehicle-to-Grid，车网互动", "B. Virtual-to-Grid，虚拟电网", "C. Value-to-Grid，价值并网", "D. Vision-to-Grid，视觉并网"], "answer": "A", "explanation": "V2G 即 Vehicle-to-Grid，车网互动，对应车网互动责任保险等创新方向。"}, {"id": "M05-Q17", "type": "multiple", "stem": "能源业务部的六项核心职能包括（　）。", "options": ["A. 能源央企业务、综合能源业务", "B. 南网供应链业务", "C. 产品创新、风险减量", "D. 销售支持"], "answer": ["A", "B", "C", "D"], "explanation": "六项核心职能：能源央企业务、综合能源业务、南网供应链业务、产品创新、风险减量、销售支持。"}]}, {"id": "M05-KP03", "title": "市场部", "summary": "部门定位：三个同心圆外层“价值圆”的归口部门，是全公司销售体系建设与管理的核心统筹部门，也是外部生态建设牵头部门。三项定位：统筹核心、生态牵头、价值归口。四项核心职能：销售体系建设与管理、重大区域客户联合攻坚、重点区域深耕、外部渠道与生态建设。四类专业团队：重大客户拓展、中介渠道拓展、银政拓展、市场营销。当前攻坚重点：标准化销售团队建设、重大客户和重点渠道攻坚、投标能力建设，坚持“市场为先、效益为先”。", "questions": [{"id": "M05-Q18", "type": "multiple", "stem": "市场部的三项定位是（　）。", "options": ["A. 统筹核心", "B. 生态牵头", "C. 价值归口", "D. 风险管控"], "answer": ["A", "B", "C"], "explanation": "市场部三项定位：统筹核心、生态牵头、价值归口。"}, {"id": "M05-Q19", "type": "multiple", "stem": "市场部的四类专业团队包括（　）。", "options": ["A. 重大客户拓展", "B. 中介渠道拓展", "C. 银政拓展", "D. 市场营销"], "answer": ["A", "B", "C", "D"], "explanation": "四类专业团队：重大客户拓展、中介渠道拓展、银政拓展、市场营销。"}, {"id": "M05-Q20", "type": "single", "stem": "市场部当前攻坚重点所坚持的原则是（　）。", "options": ["A. 市场为先、效益为先", "B. 规模为先、速度为先", "C. 合规为先、安全为先", "D. 客户为先、服务为先"], "answer": "A", "explanation": "坚持“市场为先、效益为先”。"}, {"id": "M05-Q21", "type": "multiple", "stem": "市场部的四项核心职能包括（　）。", "options": ["A. 销售体系建设与管理", "B. 重大区域客户联合攻坚", "C. 重点区域深耕", "D. 外部渠道与生态建设"], "answer": ["A", "B", "C", "D"], "explanation": "四项核心职能即为上述四项。"}]}, {"id": "M05-KP04", "title": "财产险部／健康险事业部", "summary": "部门定位：公司非车险业务的经营与两核管理中枢。八项职责：市场调研、发展规划、业务策略、预算分解、产品开发、培训、两核管理、分公司指导。团队：销售支持、核保、理赔、综合运营管理、新型电力系统风险管理中心。核保=控制风险进入（能不能保、怎么保、什么条件保）；核赔=控制损失兑现（赔不赔、赔多少、由谁核）。两核管理三大支撑：政策与授权、队伍与能力、数据与复盘。日常口诀：先看制度，再问授权，最后看数据。", "questions": [{"id": "M05-Q22", "type": "single", "stem": "财产险部／健康险事业部是公司（　）业务的经营与两核管理中枢。", "options": ["A. 车险", "B. 非车险", "C. 互联网保险", "D. 再保险"], "answer": "B", "explanation": "该部门是非车险业务的经营与两核管理中枢。"}, {"id": "M05-Q23", "type": "single", "stem": "核保的核心作用是（　），核赔的核心作用是（　）。", "options": ["A. 控制损失兑现；控制风险进入", "B. 控制风险进入；控制损失兑现", "C. 定价；核价", "D. 承保；出单"], "answer": "B", "explanation": "核保控制风险进入，核赔控制损失兑现。", "pitfall": "易错点第10条：核保、核赔的功能最容易互换。"}, {"id": "M05-Q24", "type": "single", "stem": "“赔不赔、赔多少、由谁核”是（　）环节要回答的问题。", "options": ["A. 核保", "B. 核赔", "C. 销售", "D. 精算"], "answer": "B", "explanation": "核赔回答赔不赔、赔多少、由谁核；核保回答能不能保、怎么保、什么条件保。"}, {"id": "M05-Q25", "type": "multiple", "stem": "两核管理的三大支撑是（　）。", "options": ["A. 政策与授权", "B. 队伍与能力", "C. 数据与复盘", "D. 费用与佣金"], "answer": ["A", "B", "C"], "explanation": "三大支撑：政策与授权、队伍与能力、数据与复盘。"}, {"id": "M05-Q26", "type": "single", "stem": "两核管理的日常口诀是（　）。", "options": ["A. 先看制度，再问授权，最后看数据", "B. 先问客户，再看条款，最后定价", "C. 先核保，再核赔，最后归档", "D. 先看数据，再问授权，最后看制度"], "answer": "A", "explanation": "日常口诀：先看制度，再问授权，最后看数据。"}, {"id": "M05-Q27", "type": "single", "stem": "财产险部／健康险事业部中负责绿色能源、电网资产和新能源风险研究的是（　）。", "options": ["A. 核保团队", "B. 理赔团队", "C. 综合运营管理", "D. 新型电力系统风险管理中心"], "answer": "D", "explanation": "新型电力系统风险管理中心负责绿色能源、电网资产和新能源风险研究与专业支持。"}, {"id": "M05-Q28", "type": "multiple", "stem": "财产险部／健康险事业部的八项职责包括（　）。", "options": ["A. 市场调研、发展规划、业务策略", "B. 预算分解、产品开发、培训", "C. 两核管理", "D. 分公司指导"], "answer": ["A", "B", "C", "D"], "explanation": "八项职责：市场调研、发展规划、业务策略、预算分解、产品开发、培训、两核管理、分公司指导。"}]}, {"id": "M05-KP05", "title": "互联网业务部", "summary": "三项战略定位：合规的践行者、公司互联网保险业务的开拓者、公司数字化转型的先锋队。核心工作：推动互联网技术与保险业务深度融合，由单纯产品销售向全生命周期用户服务转型。三个聚焦方向：深耕能源行业开发行业特色产品、拓展社会大众开发碎片化场景化产品、构建开放生态形成“保险＋科技＋服务”解决方案。", "questions": [{"id": "M05-Q29", "type": "multiple", "stem": "互联网业务部的三项战略定位是（　）。", "options": ["A. 合规的践行者", "B. 公司互联网保险业务的开拓者", "C. 公司数字化转型的先锋队", "D. 技术外包提供者"], "answer": ["A", "B", "C"], "explanation": "三项战略定位即为上述三项。"}, {"id": "M05-Q30", "type": "single", "stem": "互联网业务部的核心工作是推动互联网技术与保险业务深度融合，由单纯产品销售向（　）转型。", "options": ["A. 规模化销售", "B. 全生命周期用户服务", "C. 技术输出", "D. 平台建设"], "answer": "B", "explanation": "由单纯产品销售向全生命周期用户服务转型。"}, {"id": "M05-Q31", "type": "multiple", "stem": "互联网业务部的三个聚焦方向包括（　）。", "options": ["A. 深耕能源行业，开发行业特色产品", "B. 拓展社会大众，开发碎片化、场景化产品", "C. 构建开放生态，形成“保险＋科技＋服务”解决方案", "D. 自营放贷"], "answer": ["A", "B", "C"], "explanation": "三个聚焦方向即为上述三项。"}]}, {"id": "M05-KP06", "title": "财务部", "summary": "财务部定位：经营指挥棒、资源调度中心、运营监控中心。核心职能：规划管理、成本管理、会计核算、财务服务和经营预警。五大专业团队：预算管理、财务管理、会计核算与财务监督、资产税务、资金管理。财务委派四项要求：用好“指挥棒”、把好“质量关”、当好“监督员”、搭好“连心桥”。业财融合：财务参与事前预测、事中控制、事后核算。", "questions": [{"id": "M05-Q32", "type": "multiple", "stem": "财务部的定位可概括为（　）。", "options": ["A. 经营指挥棒", "B. 资源调度中心", "C. 运营监控中心", "D. 产品研发中心"], "answer": ["A", "B", "C"], "explanation": "财务部定位：经营指挥棒、资源调度中心、运营监控中心。"}, {"id": "M05-Q33", "type": "multiple", "stem": "财务部的五大专业团队包括（　）。", "options": ["A. 预算管理团队、财务管理团队", "B. 会计核算与财务监督团队", "C. 资产税务团队", "D. 资金管理团队"], "answer": ["A", "B", "C", "D"], "explanation": "五大专业团队即为上述五类。"}, {"id": "M05-Q34", "type": "multiple", "stem": "财务委派的四项要求是（　）。", "options": ["A. 用好“指挥棒”", "B. 把好“质量关”", "C. 当好“监督员”", "D. 搭好“连心桥”"], "answer": ["A", "B", "C", "D"], "explanation": "四项要求即为上述四项。"}, {"id": "M05-Q35", "type": "single", "stem": "业财融合要求财务参与（　）。", "options": ["A. 事前预测、事中控制、事后核算", "B. 只做事后核算", "C. 只做预算编制", "D. 只做资金收付"], "answer": "A", "explanation": "业财融合要求财务参与事前预测、事中控制、事后核算，通过业务和财务数据协同支持经营决策。"}]}, {"id": "M05-KP07", "title": "投资部", "summary": "部门定位：公司保险资金运用的集中管理部门，按照集中管理、统一配置、专业运作的要求，实现资产保值增值并服务公司战略。前中后台架构：前台=固收投资、权益投资、金融产品、股权投资；中台=投资风控、合规审核和信用评级；后台=资产配置计划、交易执行、资金划拨、结算和台账管理。两种管理模式：自建投资团队、委托保险资产管理机构管理。", "questions": [{"id": "M05-Q36", "type": "multiple", "stem": "投资部的前台包括（　）。", "options": ["A. 固收投资、权益投资", "B. 金融产品", "C. 股权投资", "D. 投资风控"], "answer": ["A", "B", "C"], "explanation": "前台为固收投资、权益投资、金融产品、股权投资；投资风控属于中台。", "pitfall": "前中后台的归属极易错位：中台是投资风控、合规审核和信用评级。"}, {"id": "M05-Q37", "type": "multiple", "stem": "投资部的中台职能包括（　）。", "options": ["A. 投资风控", "B. 合规审核", "C. 信用评级", "D. 交易执行"], "answer": ["A", "B", "C"], "explanation": "中台为投资风控、合规审核和信用评级；交易执行属于后台。"}, {"id": "M05-Q38", "type": "single", "stem": "投资部资金运用的要求可概括为（　）。", "options": ["A. 集中管理、统一配置、专业运作", "B. 分散管理、自主配置、灵活运作", "C. 统一管理、自主投资、集中核算", "D. 分级管理、授权经营"], "answer": "A", "explanation": "按照集中管理、统一配置、专业运作的要求。"}, {"id": "M05-Q39", "type": "multiple", "stem": "投资部可采用的资金管理模式包括（　）。", "options": ["A. 自建投资团队", "B. 委托保险资产管理机构管理", "C. 由分支机构自行投资", "D. 委托证券公司代客理财"], "answer": ["A", "B"], "explanation": "两种管理模式：自建投资团队、委托保险资产管理机构管理。"}]}, {"id": "M05-KP08", "title": "再保险部与精算部", "summary": "再保险部：负责公司再保险业务的统筹管理与专业运作；主要职责为分散承保风险、扩大承保能力、保障经营稳定、支持重大项目和产品创新；其他职责包括拓展国际保险业务、开拓国内分入再保险市场、借助再保市场专家资源提升两核能力。精算部：核心工作为产品定价、定价回溯、准备金评估、产品管理、偿付能力管理；四个团队为准备金管理、偿付能力管理、定价、产品管理。", "questions": [{"id": "M05-Q40", "type": "multiple", "stem": "再保险部的主要职责包括（　）。", "options": ["A. 分散承保风险", "B. 扩大承保能力", "C. 保障经营稳定", "D. 支持重大项目和产品创新"], "answer": ["A", "B", "C", "D"], "explanation": "四项主要职责即为上述四项。"}, {"id": "M05-Q41", "type": "multiple", "stem": "精算部的核心工作包括（　）。", "options": ["A. 产品定价、定价回溯", "B. 准备金评估", "C. 产品管理", "D. 偿付能力管理"], "answer": ["A", "B", "C", "D"], "explanation": "精算部核心工作：产品定价、定价回溯、准备金评估、产品管理、偿付能力管理。"}, {"id": "M05-Q42", "type": "single", "stem": "精算部中负责测算风险成本和费率充足性的团队是（　）。", "options": ["A. 准备金管理团队", "B. 定价团队", "C. 偿付能力管理团队", "D. 产品管理团队"], "answer": "B", "explanation": "定价团队负责测算风险成本和费率充足性。", "pitfall": "准备金团队评估未来赔付负债；偿付能力团队评估资本是否足以覆盖风险；产品团队负责条款费率开发、报备和全生命周期管理。"}, {"id": "M05-Q43", "type": "single", "stem": "精算部中负责评估未来赔付负债的团队是（　）。", "options": ["A. 准备金管理团队", "B. 定价团队", "C. 偿付能力管理团队", "D. 产品管理团队"], "answer": "A", "explanation": "准备金团队评估未来赔付负债。"}, {"id": "M05-Q44", "type": "single", "stem": "精算部中负责评估资本是否足以覆盖风险的团队是（　）。", "options": ["A. 准备金管理团队", "B. 定价团队", "C. 偿付能力管理团队", "D. 产品管理团队"], "answer": "C", "explanation": "偿付能力管理团队负责评估资本是否足以覆盖风险。"}, {"id": "M05-Q45", "type": "single", "stem": "精算是运用数学、统计、概率、经济、金融和财务方法，对风险进行量化、分析和管理，是保险公司（　）的核心技术。", "options": ["A. 稳健经营", "B. 规模扩张", "C. 品牌建设", "D. 渠道拓展"], "answer": "A", "explanation": "精算是保险公司稳健经营的核心技术。"}, {"id": "M05-Q46", "type": "single", "stem": "再保险部借助再保市场专家资源，主要意在提升公司的（　）能力。", "options": ["A. 销售", "B. 两核", "C. 财务", "D. 精算"], "answer": "B", "explanation": "借助再保市场专家资源提升两核（核保、核赔）能力。"}]}]}, {"id": "M06", "name": "保险基础知识（公司口径）", "source": "鼎和保险培训知识点汇总.pdf（第三部分）", "knowledgePoints": [{"id": "M06-KP01", "title": "风险与保险的关系", "summary": "保险研究的对象是风险。风险：在一定客观情况和时期内，随机事件的发生给经济利益造成损失的不确定性。基本特征：客观性、不确定性。按结果分纯粹风险与投机风险；按损失暴露对象分人身、财产、责任风险。风险处理方法：避免、预防与控制、自留、转移、综合运用。一般低频高损风险最适合通过保险转移。", "questions": [{"id": "M06-Q01", "type": "judge", "stem": "保险研究的对象是风险，风险的基本特征是客观性和不确定性。", "options": ["对", "错"], "answer": "对", "explanation": "保险以风险为研究对象，风险具有客观性和不确定性。"}, {"id": "M06-Q02", "type": "single", "stem": "保险的主要职能是（　）。", "options": ["A. 盈利", "B. 保障", "C. 融资", "D. 投资"], "answer": "B", "explanation": "保险的主要职能是保障，通过风险汇聚和损失分摊实现“我为人人、人人为我”。", "pitfall": "保险公司虽“双轮驱动”，但保险本身的职能定位是保障，不是盈利或投资。"}, {"id": "M06-Q03", "type": "judge", "stem": "保险通过风险汇聚和损失分摊实现“我为人人、人人为我”。", "options": ["对", "错"], "answer": "对", "explanation": "这是保险互助机制的核心表述。"}]}, {"id": "M06-KP02", "title": "可保风险六条件（公司口径）", "summary": "随机性（损失发生具有偶然性、意外性）、明确性（损失的时间、地点、规模可以明确）、重大性（损失达到值得通过保险处理的程度）、可预测性（可利用大数法则估计损失概率）、非巨灾性（对单个保险人而言不能形成无法承受的高度集中损失）、同质性（存在大量相似风险单位，便于统计和分散）。", "questions": [{"id": "M06-Q04", "type": "multiple", "stem": "可保风险的六项条件是（　）。", "options": ["A. 随机、明确、重大", "B. 可预测", "C. 非巨灾", "D. 同质"], "answer": ["A", "B", "C", "D"], "explanation": "可保风险六条件：随机、明确、重大、可预测、非巨灾、同质。", "pitfall": "考前速记口诀：“随机、明确、重大、可预测、非巨灾、同质”。"}, {"id": "M06-Q05", "type": "judge", "stem": "“重大性”是指损失要达到值得通过保险处理的程度。", "options": ["对", "错"], "answer": "对", "explanation": "重大性指损失达到一定严重程度，才有保险必要性。"}, {"id": "M06-Q06", "type": "single", "stem": "“对单个保险人而言不能形成无法承受的高度集中损失”体现的可保风险条件是（　）。", "options": ["A. 重大性", "B. 非巨灾性", "C. 同质性", "D. 明确性"], "answer": "B", "explanation": "非巨灾性是针对单个保险人承受能力提出的条件。"}]}, {"id": "M06-KP03", "title": "保险合同基本原则（四项核心＋两项派生）", "summary": "四项核心原则：保险利益、最大诚信、近因、损失补偿。派生规则：代位求偿和重复保险分摊属于损失补偿原则的派生规则。记忆提示：课件有“四项基本原则”“三个基础原则＋两个派生原则”等不同编排，最稳妥框架是四核心＋两派生。", "questions": [{"id": "M06-Q07", "type": "multiple", "stem": "保险合同的四项核心原则是（　）。", "options": ["A. 保险利益原则", "B. 最大诚信原则", "C. 近因原则", "D. 损失补偿原则"], "answer": ["A", "B", "C", "D"], "explanation": "四项核心原则：保险利益、最大诚信、近因、损失补偿。"}, {"id": "M06-Q08", "type": "single", "stem": "代位求偿原则和重复保险分摊规则属于（　）的派生规则。", "options": ["A. 保险利益原则", "B. 最大诚信原则", "C. 损失补偿原则", "D. 近因原则"], "answer": "C", "explanation": "二者都是损失补偿原则的派生规则。"}, {"id": "M06-Q09", "type": "judge", "stem": "重复保险分摊与代位求偿都属于保险利益原则的派生规则。", "options": ["对", "错"], "answer": "错", "explanation": "二者属于损失补偿原则的派生规则，不是保险利益原则。", "pitfall": "派生来源写错是本节高频陷阱。"}]}, {"id": "M06-KP04", "title": "保险合同与重要术语", "summary": "合同主体：当事人=投保人、保险人；关系人=被保险人、受益人。客体：形式上是保险标的，实质上是保险利益。常见合同文件：投保单、暂保单、保险单、保险条款、批单。五项典型特点：射幸性、附和性、双务性、要式性、最大诚信性。保险金额、保险价值、赔偿限额、免赔额的定义；财产险赔偿受实际损失、保险金额、保险利益三个上限约束。", "questions": [{"id": "M06-Q10", "type": "multiple", "stem": "保险合同的五项典型特点包括（　）。", "options": ["A. 射幸性、附和性", "B. 双务性", "C. 要式性", "D. 最大诚信性"], "answer": ["A", "B", "C", "D"], "explanation": "五项典型特点：射幸性、附和性、双务性、要式性、最大诚信性。", "pitfall": "公司口径为“五项”，复习资料口径强调“最大诚信与射幸性”，注意覆盖面。"}, {"id": "M06-Q11", "type": "single", "stem": "责任保险中保险人承担责任的最高额度称为（　）。", "options": ["A. 保险金额", "B. 赔偿限额", "C. 保险价值", "D. 免赔额"], "answer": "B", "explanation": "赔偿限额是责任保险中保险人承担责任的最高额度。"}, {"id": "M06-Q12", "type": "single", "stem": "由被保险人自行承担的损失部分是（　）。", "options": ["A. 保险金额", "B. 保险价值", "C. 免赔额", "D. 赔偿限额"], "answer": "C", "explanation": "免赔额由被保险人自行承担，分绝对免赔和相对免赔。"}, {"id": "M06-Q13", "type": "multiple", "stem": "财产险赔偿通常受哪些上限约束（　）。", "options": ["A. 实际损失", "B. 保险金额", "C. 保险利益", "D. 保险费"], "answer": ["A", "B", "C"], "explanation": "财产险赔偿受实际损失、保险金额、保险利益三个上限约束。"}]}, {"id": "M06-KP05", "title": "财产保险与人身保险比较", "summary": "标的：财产及相关利益、责任 vs 人的生命和身体。合同性质：以损失补偿为主 vs 以约定给付为主。期限：通常较短 vs 通常较长。定价基础：损失率等 vs 死亡率、利率等。保险金：受实际损失等限制 vs 原则上按约定金额给付。", "questions": [{"id": "M06-Q14", "type": "single", "stem": "人身保险的定价基础主要是（　）。", "options": ["A. 损失率", "B. 死亡率和利率等", "C. 费用率", "D. 赔付率"], "answer": "B", "explanation": "人身保险定价以死亡率、利率等为基础；财产保险以损失率等为基础。"}, {"id": "M06-Q15", "type": "single", "stem": "关于人身保险的保险金给付，下列表述正确的是（　）。", "options": ["A. 受实际损失限制", "B. 原则上按约定金额给付", "C. 不得超过保险价值", "D. 适用代位求偿"], "answer": "B", "explanation": "人身保险原则上按约定金额给付，不受实际损失限制，也不适用代位求偿。"}, {"id": "M06-Q16", "type": "judge", "stem": "财产保险合同以损失补偿为主，人身保险合同以约定给付为主。", "options": ["对", "错"], "answer": "对", "explanation": "这是两类合同性质的典型区别。"}, {"id": "M06-Q17", "type": "single", "stem": "一般而言，财产保险与人身保险的期限特点分别是（　）。", "options": ["A. 通常较长；通常较短", "B. 通常较短；通常较长", "C. 都很短", "D. 都很长"], "answer": "B", "explanation": "财产险期限通常较短，人身险期限通常较长。"}]}]}, {"id": "M07", "name": "主要产品知识", "source": "鼎和保险培训知识点汇总.pdf（第四部分）", "knowledgePoints": [{"id": "M07-KP01", "title": "车险基础结构与交强险", "summary": "机动车保险以机动车本身及其对第三者的赔偿责任为保险标的。三类常用产品：交强险（国家强制投保）、机动车综合商业保险（自愿投保）、驾乘人员意外伤害保险。交强险首先承担机动车对第三者造成的人身伤亡和财产损失的法定责任；垫付后可追偿的四类情形：无证驾驶、醉酒驾驶、车辆被盗抢期间肇事、被保险人故意制造事故；不赔且不垫付：受害人故意造成的损失、被保险车辆本车财产、间接损失、仲裁或诉讼费用等。", "questions": [{"id": "M07-Q01", "type": "single", "stem": "下列属于国家强制投保的车险产品是（　）。", "options": ["A. 车损险", "B. 交强险", "C. 商业三者险", "D. 驾乘人员意外伤害保险"], "answer": "B", "explanation": "交强险是国家强制投保的险种。", "pitfall": "易错点第11条：交强险强制，商业车险自愿。"}, {"id": "M07-Q02", "type": "judge", "stem": "机动车综合商业保险属于自愿投保的险种。", "options": ["对", "错"], "answer": "对", "explanation": "机动车综合商业保险为自愿投保。"}, {"id": "M07-Q03", "type": "multiple", "stem": "交强险垫付后可以追偿的情形包括（　）。", "options": ["A. 无证驾驶", "B. 醉酒驾驶", "C. 车辆被盗抢期间肇事", "D. 被保险人故意制造事故"], "answer": ["A", "B", "C", "D"], "explanation": "四类情形：无证驾驶、醉酒驾驶、被盗抢期间肇事、被保险人故意制造事故。"}, {"id": "M07-Q04", "type": "multiple", "stem": "交强险不赔且不垫付的情形包括（　）。", "options": ["A. 受害人故意造成的损失", "B. 被保险车辆本车财产", "C. 间接损失", "D. 仲裁或诉讼费用"], "answer": ["A", "B", "C", "D"], "explanation": "上述均属于不赔且不垫付的情形。", "pitfall": "注意区分“垫付后可追偿”与“不赔且不垫付”两类情形。"}, {"id": "M07-Q05", "type": "single", "stem": "交强险首先承担的是（　）。", "options": ["A. 被保险车辆自身的车损", "B. 机动车对第三者造成的人身伤亡和财产损失的法定责任", "C. 车上人员的人身伤亡", "D. 车辆折旧损失"], "answer": "B", "explanation": "交强险首先承担机动车对第三者的人身伤亡和财产损失法定责任。"}, {"id": "M07-Q06", "type": "judge", "stem": "车辆过户需办理合同变更；注销、停驶、丢失等符合规定的情形可以解除交强险合同。", "options": ["对", "错"], "answer": "对", "explanation": "这是交强险合同变更与解除的基本规定。"}]}, {"id": "M07-KP02", "title": "商业车险主险与附加险、新能源车险", "summary": "主险：车损险（自然灾害、意外事故、盗抢等造成被保险机动车的直接损失）、第三者责任险（先由交强险赔付，超出部分再由商业三者险承担）、车上人员责任险。常见附加险：车轮单独损失、新增设备损失、车身划痕、修理期间费用补偿、车上货物责任、精神损害抚慰金、医保外医疗费用、节假日限额翻倍等。新能源专属车险重点扩展“三电”系统（电池、电机、电控）保障，覆盖行驶、停放、充电和作业场景；四项专属附加险方向；自动驾驶 L0—L5 中，L3 被视为辅助驾驶与自动驾驶的重要分界点。", "questions": [{"id": "M07-Q07", "type": "single", "stem": "事故中第三者的损失通常的赔付顺序是（　）。", "options": ["A. 先商业三者险，再交强险", "B. 先交强险，超出部分再由商业三者险承担", "C. 由车损险赔付", "D. 由车上人员责任险赔付"], "answer": "B", "explanation": "通常先由交强险赔付，超出部分再由商业三者险承担。", "pitfall": "易错点第12条：赔付顺序颠倒是最常见的错误。"}, {"id": "M07-Q08", "type": "single", "stem": "赔偿事故造成司机或乘客人身伤亡时被保险人依法承担的责任，对应的险种是（　）。", "options": ["A. 车损险", "B. 第三者责任险", "C. 车上人员责任险", "D. 驾乘人员意外伤害保险"], "answer": "C", "explanation": "车上人员责任险赔偿车上司机或乘客的人身伤亡责任。"}, {"id": "M07-Q09", "type": "multiple", "stem": "下列属于车险常见附加险的有（　）。", "options": ["A. 车轮单独损失、新增设备损失", "B. 车身划痕、修理期间费用补偿", "C. 车上货物责任、精神损害抚慰金", "D. 医保外医疗费用、节假日限额翻倍"], "answer": ["A", "B", "C", "D"], "explanation": "以上均为常见附加险。"}, {"id": "M07-Q10", "type": "single", "stem": "新能源车险重点扩展保障的“三电”系统是指（　）。", "options": ["A. 电池、电机、电控", "B. 电池、电机、电桩", "C. 电网、电池、电控", "D. 电池、电路、电脑"], "answer": "A", "explanation": "“三电”指电池、电机、电控系统。"}, {"id": "M07-Q11", "type": "multiple", "stem": "新能源车险的覆盖场景包括（　）。", "options": ["A. 行驶", "B. 停放", "C. 充电", "D. 作业"], "answer": ["A", "B", "C", "D"], "explanation": "覆盖行驶、停放、充电和作业场景。"}, {"id": "M07-Q12", "type": "single", "stem": "在自动驾驶 L0—L5 分级中，课件视为辅助驾驶与自动驾驶重要分界点的是（　）。", "options": ["A. L1", "B. L2", "C. L3", "D. L4"], "answer": "C", "explanation": "课件将 L3 视为辅助驾驶与自动驾驶的重要分界点。"}, {"id": "M07-Q13", "type": "multiple", "stem": "新能源车险四项专属附加险方向包括（　）。", "options": ["A. 外部电网故障损失", "B. 自用充电桩损失", "C. 自用充电桩责任", "D. 新能源汽车增值服务"], "answer": ["A", "B", "C", "D"], "explanation": "四项专属附加险方向即为上述四项。"}, {"id": "M07-Q14", "type": "judge", "stem": "电池自然衰减、外部电网故障造成的损失属于新能源车险的常见免责，具体以条款为准。", "options": ["对", "错"], "answer": "对", "explanation": "电池自然衰减等通常属于常见免责。"}]}, {"id": "M07-KP03", "title": "企业财产险", "summary": "基本险：保障火灾、爆炸、雷击等基础风险。综合险：在基本险基础上增加暴雨、洪水、暴风、台风等主要自然灾害。一切险：保障范围更广，但仍受条款、免赔和除外责任限制（“一切险”不等于所有损失都赔）。核保关注：消防、防灾设施、仓储和危险品、保险价值、投保比例、重复保险、免赔和特别约定。理赔关注：事故原因与近因、实际损失、施救费用、残值、价值证明及是否足额投保。", "questions": [{"id": "M07-Q15", "type": "single", "stem": "企业财产保险中，在基本险基础上增加暴雨、洪水、暴风、台风等主要自然灾害的是（　）。", "options": ["A. 基本险", "B. 综合险", "C. 一切险", "D. 机器损坏险"], "answer": "B", "explanation": "综合险在基本险基础上增加主要自然灾害责任。"}, {"id": "M07-Q16", "type": "judge", "stem": "“一切险”意味着所有损失都能获得赔偿。", "options": ["对", "错"], "answer": "错", "explanation": "一切险保障范围更广，但仍受条款、免赔和除外责任限制。", "pitfall": "易错点第8条：一切险不等于一切损失都赔。"}, {"id": "M07-Q17", "type": "multiple", "stem": "企业财产险核保关注的重点包括（　）。", "options": ["A. 消防、防灾设施", "B. 仓储和危险品", "C. 保险价值、投保比例、重复保险", "D. 免赔和特别约定"], "answer": ["A", "B", "C", "D"], "explanation": "以上各项均为核保关注重点。"}, {"id": "M07-Q18", "type": "multiple", "stem": "企业财产险理赔关注的重点包括（　）。", "options": ["A. 事故原因与近因", "B. 实际损失、施救费用", "C. 残值、价值证明", "D. 是否足额投保"], "answer": ["A", "B", "C", "D"], "explanation": "以上均为理赔关注重点。", "pitfall": "核保与理赔的关注点经常被互换出题。"}]}, {"id": "M07-KP04", "title": "工程险与货运险", "summary": "工程险主要产品：建筑工程一切险、安装工程一切险；特点：可包含业主、承包商、分包商等多个被保险人，保险期可覆盖施工期和保证期，既可保物质损失也可保第三者责任；阶段区分：建设安装阶段优先考虑工程险，投产运营后通常转为企财险、机器损坏险、营业中断险等。货运险：国内货运险关注货物、运输工具、运输路线、包装、起运地和目的地；海运险层级为平安险→水渍险→一切险，保障范围逐级扩展；海运“一切险”仍不等于所有风险均赔。", "questions": [{"id": "M07-Q19", "type": "multiple", "stem": "工程险的特点包括（　）。", "options": ["A. 可包含业主、承包商、分包商等多个被保险人", "B. 保险期可覆盖施工期和保证期", "C. 既可保物质损失，也可保第三者责任", "D. 只承保自然灾害"], "answer": ["A", "B", "C"], "explanation": "工程险可多被保险人、跨施工期和保证期、兼顾物质损失和第三者责任。"}, {"id": "M07-Q20", "type": "single", "stem": "海上货物运输保险的层级由低到高（保障范围逐级扩展）是（　）。", "options": ["A. 水渍险→平安险→一切险", "B. 平安险→水渍险→一切险", "C. 一切险→水渍险→平安险", "D. 平安险→一切险→水渍险"], "answer": "B", "explanation": "海运险层级为平安险→水渍险→一切险。", "pitfall": "顺序颠倒是最常见错误；平安险并非“保平安”，其责任范围最小。"}, {"id": "M07-Q21", "type": "single", "stem": "某项目建成投产后，通常应由工程险转向的险种组合是（　）。", "options": ["A. 建筑工程一切险", "B. 企财险、机器损坏险、营业中断险等", "C. 交强险", "D. 出口信用险"], "answer": "B", "explanation": "建设安装阶段优先考虑工程险；投产运营后通常转为企财险、机器损坏险、营业中断险等。"}, {"id": "M07-Q22", "type": "multiple", "stem": "国内货运险核保通常关注（　）。", "options": ["A. 货物", "B. 运输工具、运输路线", "C. 包装", "D. 起运地和目的地"], "answer": ["A", "B", "C", "D"], "explanation": "以上均为国内货运险的关注要素。"}, {"id": "M07-Q23", "type": "judge", "stem": "海运“一切险”意味着所有风险都能获得赔偿。", "options": ["对", "错"], "answer": "错", "explanation": "故意行为、自然损耗、本质缺陷、包装不良等可能属于除外责任。"}]}, {"id": "M07-KP05", "title": "责任险、信用险与保证险", "summary": "责任险：公众责任险（公共场所经营或管理活动造成第三方损害）、产品责任险（产品缺陷）、职业责任险（专业人员执业过失）、雇主责任险（企业对员工因工作原因受到人身伤害依法承担的赔偿责任）；以法律或合同责任为基础，通常设置赔偿限额，并关注索赔通知和法律费用。信用险通常由权利人投保，防范义务人拖欠或违约风险；保证险通常由义务人投保，为其向权利人履约提供保障。", "questions": [{"id": "M07-Q24", "type": "single", "stem": "“产品缺陷造成第三方人身或财产损害”对应的责任险是（　）。", "options": ["A. 公众责任险", "B. 产品责任险", "C. 职业责任险", "D. 雇主责任险"], "answer": "B", "explanation": "产品责任险保障产品缺陷造成的第三方损害。"}, {"id": "M07-Q25", "type": "single", "stem": "企业对员工因工作原因受到人身伤害依法承担的赔偿责任，对应（　）。", "options": ["A. 公众责任险", "B. 产品责任险", "C. 职业责任险", "D. 雇主责任险"], "answer": "D", "explanation": "雇主责任险保障企业依法对员工承担的赔偿责任。"}, {"id": "M07-Q26", "type": "judge", "stem": "信用险通常由权利人投保，防范义务人拖欠或违约风险。", "options": ["对", "错"], "answer": "对", "explanation": "信用险由权利人投保；保证险由义务人投保。", "pitfall": "易错点第9条：信用险=权利人投保；保证险=义务人投保。"}, {"id": "M07-Q27", "type": "judge", "stem": "保证险通常由义务人投保，为其向权利人履约提供保障。", "options": ["对", "错"], "answer": "对", "explanation": "保证险由义务人投保，保障其履约。"}, {"id": "M07-Q28", "type": "multiple", "stem": "下列属于保证保险的有（　）。", "options": ["A. 投标保证保险", "B. 履约保证保险", "C. 电费履约保证保险", "D. 出口信用险"], "answer": ["A", "B", "C"], "explanation": "投标保证保险、履约保证保险、电费履约保证保险属于保证险；出口信用险属于信用险。"}, {"id": "M07-Q29", "type": "single", "stem": "责任保险的保险责任基础是（　）。", "options": ["A. 意外事故", "B. 法律或合同责任", "C. 自然灾害", "D. 道德风险"], "answer": "B", "explanation": "责任险以法律或合同责任为基础，通常设置赔偿限额并关注索赔通知和法律费用。"}]}, {"id": "M07-KP06", "title": "意外险与健康险", "summary": "意外险构成意外的四要素：外来的、突发的、非本意的、非疾病的；三类核心保障：意外身故/伤残、意外医疗、意外住院津贴；常见免责或需特别扩展的情形：故意行为、醉酒、吸毒、无证驾驶、高风险运动、猝死、中暑等；团体意外险关注员工名单、职业类别和保障责任，建工团意险还需关注项目、人员流动和工期。健康险主要包括医疗保险、疾病保险、失能收入损失保险、护理保险和医疗意外保险；短期健康险保险期间通常不超过一年；销售短期健康险必须说明等待期、健康告知、免责条款、续保安排、理赔方式；短期健康险多采用自然费率，不得随意承诺保证续保。", "questions": [{"id": "M07-Q30", "type": "multiple", "stem": "构成“意外”的四要素是（　）。", "options": ["A. 外来的", "B. 突发的", "C. 非本意的", "D. 非疾病的"], "answer": ["A", "B", "C", "D"], "explanation": "意外四要素：外来、突发、非本意、非疾病。", "pitfall": "“猝死”通常因疾病导致，多属意外险免责或需特别扩展。"}, {"id": "M07-Q31", "type": "multiple", "stem": "意外险的三类核心保障包括（　）。", "options": ["A. 意外身故/伤残", "B. 意外医疗", "C. 意外住院津贴", "D. 疾病住院报销"], "answer": ["A", "B", "C"], "explanation": "三类核心保障：意外身故/伤残、意外医疗、意外住院津贴。"}, {"id": "M07-Q32", "type": "single", "stem": "下列情形中，通常属于意外险免责或需特别扩展的是（　）。", "options": ["A. 交通事故导致的骨折", "B. 工作场所的机械伤害", "C. 猝死、中暑", "D. 意外摔伤"], "answer": "C", "explanation": "猝死、中暑等通常属于免责或需特别扩展的情形。"}, {"id": "M07-Q33", "type": "multiple", "stem": "健康保险主要包括（　）。", "options": ["A. 医疗保险、疾病保险", "B. 失能收入损失保险", "C. 护理保险", "D. 医疗意外保险"], "answer": ["A", "B", "C", "D"], "explanation": "健康险包括医疗保险、疾病保险、失能收入损失保险、护理保险和医疗意外保险。"}, {"id": "M07-Q34", "type": "single", "stem": "短期健康保险的保险期间通常（　）。", "options": ["A. 不超过一年", "B. 不超过三年", "C. 不少于五年", "D. 无期限限制"], "answer": "A", "explanation": "短期健康险保险期间通常不超过一年。"}, {"id": "M07-Q35", "type": "multiple", "stem": "销售短期健康险时必须向客户说明的内容包括（　）。", "options": ["A. 等待期、健康告知", "B. 免责条款", "C. 续保安排", "D. 理赔方式"], "answer": ["A", "B", "C", "D"], "explanation": "上述四项均为必须说明的内容。"}, {"id": "M07-Q36", "type": "judge", "stem": "短期健康险多采用自然费率，保费可能随年龄变化，销售人员不得随意承诺保证续保。", "options": ["对", "错"], "answer": "对", "explanation": "短期健康险费率与续保安排存在不确定性，不得承诺保证续保。", "pitfall": "这是销售合规红线在具体产品上的体现。"}]}, {"id": "M07-KP07", "title": "场景与产品匹配", "summary": "工厂设备和存货→企业财产险、机器损坏险、营业中断险；道路桥梁生产线建设安装→建筑/安装工程一切险、第三者责任、保证期扩展；员工施工出差工伤→雇主责任险、团体意外险、建工团意险、意外医疗；员工健康和重大疾病→医疗险、重大疾病险、失能收入损失险、护理险；海外买家拖欠、合同履约→信用险、履约/投标保证险；货物运输途中受损→国内或海洋货运险。", "questions": [{"id": "M07-Q37", "type": "multiple", "stem": "工厂设备和存货面临的风险，初步产品组合可包括（　）。", "options": ["A. 企业财产险", "B. 机器损坏险", "C. 营业中断险", "D. 交强险"], "answer": ["A", "B", "C"], "explanation": "工厂设备和存货对应企财险、机器损坏险、营业中断险。"}, {"id": "M07-Q38", "type": "single", "stem": "海外买家拖欠货款、合同履约风险，宜匹配（　）。", "options": ["A. 货运险", "B. 信用险、履约/投标保证险", "C. 雇主责任险", "D. 车损险"], "answer": "B", "explanation": "海外买家拖欠、合同履约对应信用险、履约/投标保证险。"}, {"id": "M07-Q39", "type": "multiple", "stem": "员工施工、出差、工伤场景的产品组合可包括（　）。", "options": ["A. 雇主责任险", "B. 团体意外险", "C. 建工团意险", "D. 意外医疗"], "answer": ["A", "B", "C", "D"], "explanation": "以上均为该场景的初步产品组合。"}, {"id": "M07-Q40", "type": "single", "stem": "道路、桥梁、生产线建设安装场景，宜优先匹配（　）。", "options": ["A. 企业财产险", "B. 建筑/安装工程一切险、第三者责任", "C. 信用险", "D. 健康险"], "answer": "B", "explanation": "建设安装场景优先考虑工程险及第三者责任、保证期扩展。"}]}]}, {"id": "M08", "name": "销售、承保与理赔流程", "source": "鼎和保险培训知识点汇总.pdf（第五部分）", "knowledgePoints": [{"id": "M08-KP01", "title": "销售的核心认知", "summary": "财险销售不是简单推销产品，而是基于客户风险场景提供风险识别、方案设计和长期服务。车险是个人客户流量基础；非车险是团体客户价值引擎。销售人员四项核心能力：风险识别、方案定制、沟通转化、长期服务经营。", "questions": [{"id": "M08-Q01", "type": "single", "stem": "关于财险销售的定位，下列说法正确的是（　）。", "options": ["A. 核心是推销产品", "B. 基于客户风险场景提供风险识别、方案设计和长期服务", "C. 以低价取胜", "D. 只关注单次成交"], "answer": "B", "explanation": "财险销售强调基于风险场景的方案式服务和长期经营。"}, {"id": "M08-Q02", "type": "single", "stem": "“车险是个人客户流量基础，非车险是（　）价值引擎”。", "options": ["A. 个人客户", "B. 团体客户", "C. 互联网客户", "D. 政府客户"], "answer": "B", "explanation": "车险是个人客户流量基础，非车险是团体客户价值引擎。"}, {"id": "M08-Q03", "type": "multiple", "stem": "销售人员的四项核心能力是（　）。", "options": ["A. 风险识别", "B. 方案定制", "C. 沟通转化", "D. 长期服务经营"], "answer": ["A", "B", "C", "D"], "explanation": "四项核心能力：风险识别、方案定制、沟通转化、长期服务经营。"}]}, {"id": "M08-KP02", "title": "业务拓展八步法", "summary": "1.客群挖掘与精准触达；2.需求摸排与风险诊断；3.定制专属保障方案；4.商务洽谈与报价测算；5.投标竞价与资料闭环；6.合规承保与出单交付；7.前置风控与增值服务；8.续保及全生命周期经营。速记：获客—诊断—方案—洽谈—投标资料—承保出单—风控服务—续保经营。", "questions": [{"id": "M08-Q04", "type": "single", "stem": "业务拓展八步法中，承接“需求摸排与风险诊断”之后的步骤是（　）。", "options": ["A. 客群挖掘与精准触达", "B. 定制专属保障方案", "C. 商务洽谈与报价测算", "D. 续保及全生命周期经营"], "answer": "B", "explanation": "八步法顺序：获客—诊断—方案—洽谈—投标资料—承保出单—风控服务—续保经营。"}, {"id": "M08-Q05", "type": "single", "stem": "业务拓展八步法中最先开展的一步是（　）。", "options": ["A. 需求摸排与风险诊断", "B. 客群挖掘与精准触达", "C. 商务洽谈与报价测算", "D. 前置风控与增值服务"], "answer": "B", "explanation": "第一步是客群挖掘与精准触达。"}, {"id": "M08-Q06", "type": "multiple", "stem": "下列关于业务拓展八步法的步骤，属于其中的有（　）。", "options": ["A. 投标竞价与资料闭环", "B. 合规承保与出单交付", "C. 前置风控与增值服务
